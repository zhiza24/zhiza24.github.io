<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#FDFBF7">
  <title>Архитектура Личности · Лабиринт желаний</title>
  <link rel="stylesheet" href="css/game.css">
  <style>
    body{display:block;padding:18px}
    .labyrinth-shell{max-width:680px;margin:24px auto;padding:clamp(20px,5vw,30px);background:#fff;border:1px solid #eee7db;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
    .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#a8874d}
    .muted{color:#75665e;line-height:1.6}
    .progress-track{height:5px;background:#eee7db;border-radius:9px;overflow:hidden;margin:16px 0 22px}
    .progress-track span{display:block;height:100%;background:#c5a059;transition:width .2s ease}
    .step-card{margin-bottom:24px}
    .textarea-field{width:100%;min-height:120px;padding:16px;font-size:15px;border:1.5px solid #e5e0d8;background:#f9f6f0;border-radius:12px;color:#2c221e;font:inherit;resize:vertical;box-sizing:border-box}
    .textarea-field:focus{outline:none;border-color:#c5a059;background:#fff}
    .checkbox-option{display:flex;align-items:flex-start;padding:14px 16px;margin-bottom:10px;border:1.5px solid #e5e0d8;background:#f9f6f0;border-radius:10px;cursor:pointer;font-size:15px;color:#2c221e;line-height:1.45}
    .checkbox-option.selected{border-color:#c5a059;background:#faf6ed}
    .checkbox-option input{margin:3px 12px 0 0;accent-color:#c5a059;flex:0 0 auto}
    .actions{display:flex;gap:12px;margin-top:24px}
    .actions button{padding:12px 20px;border-radius:9px;cursor:pointer;font:inherit}
    .btn-secondary{border:1px solid #ccc;background:#f5f5f5;color:#302923}
    .btn-primary{border:0;background:#a8874d;color:#fff;flex:1}
    .btn-primary:disabled,.btn-secondary:disabled{opacity:.45;cursor:not-allowed}
    .results-box{background:#f9f6f0;border:1px solid #e5e0d8;border-radius:12px;padding:20px;margin-bottom:24px}
    .summary-item{margin-bottom:16px;border-bottom:1px solid #e5e0d8;padding-bottom:12px}
    .summary-item:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
    .summary-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#a8874d;margin-bottom:6px}
    .summary-content{font-size:15px;color:#2c221e;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
    @media(max-width:480px){.labyrinth-shell{margin:8px auto}.actions{gap:8px}.actions button{padding:12px 14px}}
  </style>
</head>
<body>
<main class="labyrinth-shell">
  <div class="eyebrow">Этап C · Лабиринт желаний</div>
  <h1 id="main-title">Лабиринт желаний</h1>
  <p id="progress-subtitle" class="muted">Исследование подлинных устремлений, преград и вторичных выгод</p>
  <div id="quiz-area">
    <div id="q-counter" class="muted">Шаг 1 из 4</div>
    <div class="progress-track" aria-hidden="true"><span id="progress-fill" style="width:25%"></span></div>
    <section class="step-card">
      <h2 id="step-prompt" style="font-size:18px;font-weight:500;line-height:1.5">Загрузка...</h2>
      <div id="step-input-container"></div>
    </section>
    <p id="save-status" class="muted" aria-live="polite">Ответы сохраняются в профиле этого браузера.</p>
    <div class="actions">
      <button class="btn-secondary" id="prev-btn" type="button">Назад</button>
      <button class="btn-primary" id="next-btn" type="button">Далее</button>
    </div>
  </div>
  <section id="results-area" hidden>
    <div class="results-box">
      <h2 style="color:#a8874d;margin-top:0">Твоя карта Лабиринта желаний</h2>
      <div id="summary-container"></div>
    </div>
    <div class="actions">
      <button class="btn-secondary" id="restart-btn" type="button">Пройти заново</button>
      <button class="btn-primary" id="research-btn" type="button">К исследовательскому разделу</button>
    </div>
  </section>
</main>
<script src="js/profile.js"></script>
<script src="data/labyrinth_data.js"></script><script src="data/research_interpretations.js"></script>
<script>
(function(){
'use strict';
const steps=window.labyrinthData.steps;
const copy=window.RESEARCH_INTERPRETATIONS.labyrinth;
const moduleKey='labyrinth';
let currentStepIdx=0,noDesireMode=false,pathIndex=0;
let userAnswers={reflections:{},multi:{},noDesire:{},noDesirePathActive:false,noDesirePathComplete:false};
const $=id=>document.getElementById(id);
function normalizeAnswers(value){
 const source=value&&typeof value==='object'?value:{};
 return {
  reflections:source.reflections&&typeof source.reflections==='object'?source.reflections:{},
  multi:source.multi&&typeof source.multi==='object'?source.multi:{},
  noDesire:source.noDesire&&typeof source.noDesire==='object'?source.noDesire:{},
  noDesirePathActive:!!source.noDesirePathActive,
  noDesirePathComplete:!!source.noDesirePathComplete
 };
}
function saveProgress(){
 AlchemistProfile.update(profile=>{
  profile.research[moduleKey]={
   ...(profile.research[moduleKey]||{}),currentStepIdx,noDesireMode,pathIndex,
   rawAnswers:userAnswers,status:'in_progress'
  };
 });
 $('save-status').textContent='Ответы сохранены в профиле этого браузера.';
}
function addTextarea(container,prompt,placeholder,value,onInput){
 const textarea=document.createElement('textarea');textarea.className='textarea-field';textarea.placeholder=placeholder||'';textarea.value=value||'';textarea.setAttribute('aria-label',prompt||'Твой ответ');
 textarea.addEventListener('input',()=>onInput(textarea.value));container.appendChild(textarea);
}
function renderStep(){
 const container=$('step-input-container');container.replaceChildren();
 if(noDesireMode){
  const p=copy.noDesirePath.steps[pathIndex];
  $('q-counter').textContent='Если пока не знаешь, чего хочешь · '+(pathIndex+1)+' из '+copy.noDesirePath.steps.length;
  $('main-title').textContent=copy.noDesirePath.title;
  $('progress-subtitle').textContent='Не нужно придумывать большую цель. Ищем первый честный ориентир.';
  $('step-prompt').textContent=p.title+'\n\n'+p.prompt;
  $('progress-fill').style.width=((pathIndex+1)/(steps.length+copy.noDesirePath.steps.length)*100)+'%';
  addTextarea(container,p.prompt,p.placeholder,userAnswers.noDesire[p.id],value=>{userAnswers.noDesire[p.id]=value;saveProgress();});
  $('prev-btn').disabled=pathIndex===0;
  $('next-btn').textContent=pathIndex===copy.noDesirePath.steps.length-1?'Перейти к препятствиям':'Далее';
  return;
 }
 const step=steps[currentStepIdx];
 $('q-counter').textContent='Шаг '+(currentStepIdx+1)+' из '+steps.length;
 $('main-title').textContent=step.title;
 $('progress-subtitle').textContent=step.subtitle;
 $('step-prompt').textContent=step.prompt;
 $('progress-fill').style.width=((copy.noDesirePath.steps.length+currentStepIdx+1)/(steps.length+copy.noDesirePath.steps.length)*100)+'%';
 if(step.type==='input_reflection'){
  addTextarea(container,step.prompt,step.placeholder,userAnswers.reflections[step.id],value=>{userAnswers.reflections[step.id]=value;saveProgress();});
  if(currentStepIdx===0){
   const button=document.createElement('button');button.type='button';button.className='btn-secondary';button.textContent='Пока не знаю, чего хочу';
   button.addEventListener('click',()=>{noDesireMode=true;pathIndex=0;userAnswers.noDesirePathActive=true;saveProgress();renderStep();});
   container.appendChild(button);
  }
 }else if(step.type==='multi_choice'){
  if(!Array.isArray(userAnswers.multi[step.id]))userAnswers.multi[step.id]=[];
  step.options.forEach(option=>{
   const label=document.createElement('label');label.className='checkbox-option'+(userAnswers.multi[step.id].includes(option.id)?' selected':'');
   const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.value=option.id;checkbox.checked=userAnswers.multi[step.id].includes(option.id);
   checkbox.addEventListener('change',()=>{const selected=new Set(userAnswers.multi[step.id]);if(checkbox.checked)selected.add(option.id);else selected.delete(option.id);userAnswers.multi[step.id]=Array.from(selected);label.classList.toggle('selected',checkbox.checked);saveProgress();});
   const text=document.createElement('span');text.textContent=option.text;label.append(checkbox,text);container.appendChild(label);
  });
 }
 $('prev-btn').disabled=currentStepIdx===0;
 $('next-btn').textContent=currentStepIdx===steps.length-1?'Завершить исследование':'Далее';
}
function buildOutcome(){
 const desire=(userAnswers.reflections.desire_definition||'').trim();
 const obstacles=userAnswers.multi.obstacles_mapping||[];
 const selected=steps[1].options.filter(o=>obstacles.includes(o.id));
 const categories=selected.map(o=>o.category);
 const hasExternal=categories.some(c=>c==='resource'||c==='external');
 const hasInternal=categories.some(c=>c==='social'||c==='internal'||c==='clarity'||c==='behavioral');
 const sections=[];
 if(userAnswers.noDesirePathActive)sections.push(copy.noDesirePath.result);
 else sections.push(desire.length>=18?copy.outcomes.clear:desire.length>0?copy.outcomes.emerging:copy.outcomes.unknown);
 if(selected.length)sections.push(hasExternal&&hasInternal?copy.outcomes.mixedBarriers:hasExternal?copy.outcomes.barriersExternal:copy.outcomes.barriersInternal);
 const gain=(userAnswers.reflections.secondary_gain||'').trim();
 const price=(userAnswers.reflections.price_of_change||'').trim();
 sections.push(gain?copy.outcomes.secondaryGain:{title:copy.insufficient.title,text:'Пока нет твоего описания того, что сохраняет привычное положение. Мы не будем придумывать скрытую выгоду за тебя.'});
 sections.push(price?copy.outcomes.price:{title:copy.insufficient.title,text:'Пока не описана цена перемен. Это поле можно заполнить позже; отсутствие ответа не означает, что ты не готов к изменениям.'});
 const completedFields=[desire.length>0,userAnswers.noDesirePathComplete,selected.length>0,gain.length>0,price.length>0].filter(Boolean).length;
 return {sections,insufficient:completedFields<2?copy.insufficient:null};
}
function finishQuiz(save=true){
 const outcome=buildOutcome();
 if(save){
  const result={summary:userAnswers,interpretation:outcome};
  AlchemistProfile.setResearchResult(moduleKey,result,userAnswers);
  AlchemistProfile.update(profile=>{profile.research[moduleKey].currentStepIdx=steps.length-1;profile.research[moduleKey].status='completed';profile.research[moduleKey].rawAnswers=userAnswers;});
 }
 $('quiz-area').hidden=true;$('results-area').hidden=false;renderSummary(outcome);
}
function renderSummary(outcome){
 const container=$('summary-container');container.replaceChildren();
 const title=document.createElement('h3');title.textContent='Твои ответы';container.appendChild(title);
 steps.forEach(step=>{
  const item=document.createElement('div');item.className='summary-item';
  const h=document.createElement('div');h.className='summary-title';h.textContent=step.title;
  const content=document.createElement('div');content.className='summary-content';
  let value='Пока нет ответа';
  if(step.type==='input_reflection')value=userAnswers.reflections[step.id]||'Пока нет ответа';
  else if(step.type==='multi_choice'){const selected=userAnswers.multi[step.id]||[];const texts=step.options.filter(o=>selected.includes(o.id)).map(o=>'• '+o.text);value=texts.length?texts.join('\n'):'Пока ничего не выбрано';}
  content.textContent=value;item.append(h,content);container.appendChild(item);
 });
 if(userAnswers.noDesirePathActive){
  const h=document.createElement('h3');h.textContent=copy.noDesirePath.title;container.appendChild(h);
  copy.noDesirePath.steps.forEach(p=>{const item=document.createElement('div');item.className='summary-item';const t=document.createElement('div');t.className='summary-title';t.textContent=p.title;const c=document.createElement('div');c.className='summary-content';c.textContent=userAnswers.noDesire[p.id]||'Пока нет ответа';item.append(t,c);container.appendChild(item);});
 }
 const heading=document.createElement('h3');heading.textContent='Что показывают ответы';container.appendChild(heading);
 outcome.sections.forEach(section=>{const item=document.createElement('section');item.className='results-box';const h=document.createElement('h4');h.textContent=section.title;const p=document.createElement('p');p.textContent=section.text;item.append(h,p);if(section.next){const n=document.createElement('p');n.textContent='Следующий шаг: '+section.next;item.appendChild(n);}container.appendChild(item);});
 if(outcome.insufficient){const item=document.createElement('p');item.className='muted';item.textContent=outcome.insufficient.text;container.appendChild(item);}
}
function next(){
 if(noDesireMode){
  if(pathIndex<copy.noDesirePath.steps.length-1){pathIndex++;saveProgress();renderStep();}
  else{userAnswers.noDesirePathComplete=true;noDesireMode=false;currentStepIdx=1;saveProgress();renderStep();}
  return;
 }
 if(currentStepIdx<steps.length-1){currentStepIdx++;saveProgress();renderStep();}
 else finishQuiz(true);
}
function previous(){
 if(noDesireMode){if(pathIndex>0)pathIndex--;else noDesireMode=false;saveProgress();renderStep();return;}
 if(currentStepIdx>0){currentStepIdx--;saveProgress();renderStep();}
}
function restartQuiz(){
 if(!window.confirm('Пройти Лабиринт желаний заново? Сохраненные ответы этого модуля будут заменены.'))return;
 userAnswers={reflections:{},multi:{},noDesire:{},noDesirePathActive:false,noDesirePathComplete:false};currentStepIdx=0;noDesireMode=false;pathIndex=0;
 AlchemistProfile.update(profile=>{profile.research[moduleKey]={status:'in_progress',currentStepIdx:0,noDesireMode:false,pathIndex:0,rawAnswers:userAnswers,results:{},completedAt:null};});
 $('results-area').hidden=true;$('quiz-area').hidden=false;$('save-status').textContent='Начато новое прохождение.';renderStep();
}
$('prev-btn').addEventListener('click',previous);
$('next-btn').addEventListener('click',next);
$('restart-btn').addEventListener('click',restartQuiz);
$('research-btn').addEventListener('click',()=>{window.location.href='research.html';});
function initLabyrinth(){
 const saved=AlchemistProfile.load().research&&AlchemistProfile.load().research[moduleKey];
 if(saved&&saved.rawAnswers)userAnswers=normalizeAnswers(saved.rawAnswers);
 if(saved&&saved.status==='completed'){finishQuiz(false);return;}
 if(saved&&Number.isInteger(saved.currentStepIdx))currentStepIdx=Math.min(Math.max(saved.currentStepIdx,0),steps.length-1);
 if(saved){noDesireMode=!!saved.noDesireMode;pathIndex=Math.min(Math.max(Number(saved.pathIndex)||0,0),copy.noDesirePath.steps.length-1);}
 renderStep();
}
initLabyrinth();
})();
</script>
<script src="js/navigation.js"></script>
</body>
</html>
