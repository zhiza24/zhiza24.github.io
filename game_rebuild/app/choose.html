<script src="stages.js?v=4"></script><script src="scroll.js?v=s6"></script><script>
var C=[
{k:'s',img:'card_s.jpg',n:'Тропа молний',p:'Эта дорога полна движения и неожиданных поворотов. Здесь возможности появляются внезапно, а перемены могут открыть путь туда, куда еще недавно невозможно было попасть. Главное сокровище этой тропы — способность не упускать момент.',m:'Не всякая молния освещает дорогу надолго. Иногда события развиваются быстрее, чем удается рассмотреть все препятствия. Придется учиться различать возможности и ловушки стремительного пути.'},
{k:'n',img:'card_n.jpg',n:'Туманная долина',p:'Эта дорога открывается постепенно. Здесь важно замечать едва различимые знаки, прислушиваться к происходящему и не торопить события. Туман скрывает лишнее, оставляя возможность увидеть то, что обычно ускользает от взгляда.',m:'Не всегда можно сразу понять, куда ведет тропа. Иногда приходится долго идти в неизвестности, прежде чем открывается нужное направление. Главное испытание — не потерять путь, пока ищешь его очертания.'},
{k:'str',img:'card_str.jpg',n:'Горный перевал',p:'Эта дорога ведет вверх, туда, откуда открывается широкий обзор. С высоты становятся заметны связи между событиями, скрытые маршруты и возможности, которые невозможно увидеть снизу. Здесь можно проложить собственный путь, не повторяя чужих маршрутов.',m:'Подъем требует усилий. Не на каждом участке встретятся указатели и проводники. Иногда придется самостоятельно искать проходы, принимать решения и нести ответственность за выбранное направление.'},
{k:'z',img:'card_z.jpg',n:'Река попутчиков',p:'Эта дорога проходит по течению большой реки. На ее берегах встречаются проводники, союзники и случайные попутчики. Здесь одни возможности рождаются из встреч, другие — из общего движения. Иногда именно тот, кто оказывается рядом, помогает увидеть новый путь.',m:'Течение меняется, а вместе с ним могут меняться и направления движения. Не каждый попутчик знает, куда стремится река. Важно не потерять собственный ориентир среди чужих маршрутов.'},
{k:'f',img:'wheel.webp',n:'Пусть выберет судьба',p:'Перед тобой все дороги. Ни одна еще не закрыта, и каждая может привести к неожиданным открытиям. Иногда случайная встреча или неожиданный поворот становятся началом самого важного путешествия. Позволь миру сделать первый ход.',m:GG('Когда направление выбирает случай, невозможно заранее знать, куда он приведет. Придется принять неизвестность и встретиться с дорогой, которую ты сам не выбирал.','Когда направление выбирает случай, невозможно заранее знать, куда он приведет. Придется принять неизвестность и встретиться с дорогой, которую ты сама не выбирала.')}];
var i=0,READ={},readT=0,deckOn=false;

function thumbs(){th.innerHTML=C.map(function(x,j){return '<button type="button" class="'+(j==i?'on':'')+(READ[j]?' read':'')+'" aria-label="'+x.n+'" aria-pressed="'+(j==i?'true':'false')+'"><img src="img/'+x.img+'" alt="">'+SPARK+'</button>'}).join('');th.querySelectorAll('button').forEach(function(b,j){b.onclick=function(){if(i===j)return;i=j;dr()}})}

function edge(){var b=big;b.classList.toggle('end',b.scrollTop+b.clientHeight>=b.scrollHeight-4)}
function fit(){var b=big,fs=19;b.classList.remove('over');b.style.fontSize=fs+'px';while(fs>15&&b.scrollHeight>b.clientHeight+1){fs-=.5;b.style.fontSize=fs+'px'}b.classList.toggle('over',b.scrollHeight>b.clientHeight+1);edge()}
function markRead(){READ[i]=true;var b=th.children[i];if(b)b.classList.add('read')}
function scheduleRead(){clearTimeout(readT);if(deckOn)readT=setTimeout(markRead,900)}
function dr(){var c=C[i],t=document.getElementById('txt'),n=t.cloneNode(false);n.innerHTML=descHtml(c);t.parentNode.replaceChild(n,t);big.scrollTop=0;fit();th.querySelectorAll('button').forEach(function(b,j){b.classList.toggle('on',j==i);b.setAttribute('aria-pressed',j==i?'true':'false')});scheduleRead()}
thumbs();dr();

big.addEventListener('scroll',edge,{passive:true});

var FQ=[[GG('Почему ты не выбрал сам?','Почему ты не выбрала сама?'),[['Боюсь ошибиться','n'],['Все пути кажутся интересными','s'],['Пусть решит кто-то другой','z'],['Хочу проверить, что выпадет, а потом решу свое','str']]],['Если выпадет трудная карта, что сделаешь?',[['Пойду сразу, разберусь по дороге','s'],['Сначала изучу ее','n'],['Перестрою под себя','str'],['Найду, кто поможет','z']]],['Как ты чаще принимаешь решения в жизни?',[['Быстро, на импульсе','s'],['Долго взвешиваю','n'],['Делаю по-своему','str'],['Советуюсь с близкими','z']]]];
function fate(){var sc={s:0,n:0,str:0,z:0},q=0;function sh(){if(q>=FQ.length){fq.style.display='none';var r=Math.floor(Math.random()*4);i=r;var top=Object.keys(sc).sort(function(a,b){return sc[b]-sc[a]})[0];fin(C[r],top,'выбор судьбы, ближе к типу '+top);return}var f=FQ[q];fq.style.display='flex';fq.innerHTML='<div style="max-width:420px;width:100%"><div style="font:700 26px Cormorant Garamond,serif;color:#ffe9a8;margin-bottom:14px">'+f[0]+'</div>'+f[1].map(function(a){return '<button class="go" style="background:#24160c;color:#f4ecdf;border:1.5px solid #c9a46a" data-k="'+a[1]+'">'+a[0]+'</button>'}).join('')+'</div>';fq.querySelectorAll('button').forEach(function(b){b.onclick=function(){sc[b.dataset.k]++;q++;sh()}})}sh()}
function fin(c,k,r){var p=GP();p.done[2]=1;p.log.push({s:2,t:'Выбор карты пути',r:r||c.n,d:new Date().toLocaleDateString('ru')});SP(p);try{var P=JSON.parse(localStorage.getItem('alch_v5_profile'))||{};P.mapStyle=k;localStorage.setItem('alch_v5_profile',JSON.stringify(P))}catch(e){}fx.style.display='flex';fx.innerHTML='Твоя карта: «'+c.n+'»<small>Твой путь определен. Первая отметка появилась в Дневнике.</small><small>Впереди — новые открытия.</small>';setTimeout(function(){location.href=GRoute.advance()},3000)}
function pick(){var c=C[i];if(c.k=='f'){fate();return}fin(c,c.k)}

function revealDeck(animated){document.documentElement.classList.add('gsc-deck-focus');if(deck.dataset.ready)return;deck.dataset.ready='1';deckOn=true;scheduleRead();var reduce=false;try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}if(animated&&!reduce){deck.classList.add('is-enter');setTimeout(function(){deck.classList.remove('is-enter')},1400)}fit()}
Scroll.show({id:'choose',noIcon:true,everyTime:true,delay:80,fast:true,closeLabel:'Выбрать карту',title:'ТВОЙ ПУТЬ НАЧИНАЕТСЯ',html:'<p class="lead">Перед тобой пять дорог.</p><p>У каждой свой характер, свои возможности и испытания. Одни открывают путь через стремительное движение, другие требуют терпения, самостоятельности или умения находить попутчиков.</p><p>Рассмотри карты и выбери ту дорогу, по которой тебе хочется отправиться.</p><p>Не ищи правильный ответ. Доверься своему выбору.</p>',onClose:function(){revealDeck(true)}});
