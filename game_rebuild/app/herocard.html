<script>
(function(){var P={};try{P=JSON.parse(localStorage.getItem('alch_v5_profile'))||{}}catch(e){}
var E=GEsc,f=GGender(P)==='f';if(window.GHeroApply)GHeroApply();
document.getElementById('nm').textContent=P.name||'Герой';
var C=(P.flow&&P.flow.completed)||{},n=Object.keys(C).length;
document.getElementById('sb').textContent=n?('Пройдено шагов: '+n+' из '+(GFLOW.length-1)):'Путь только начинается';
GHM.ready(function(){
 /* портрет: короткие строки из пройденных результатов */
 var L=[],D=window.POCHERK_DIRS||{},CARDS={s:'Тропа молний',n:'Туманная долина',str:'Горный перевал',z:'Река попутчиков',f:'Пусть выберет судьба'};
 if(CARDS[P.mapStyle])L.push(['Мой путь',CARDS[P.mapStyle]]);
 if(P.pocherk&&P.pocherk.lead)L.push(['Мой почерк',P.pocherk.mixed&&P.pocherk.leads?P.pocherk.leads.map(function(k){return D[k]}).join(' и '):D[P.pocherk.lead]]);
 if(P.ego&&P.ego.lead)L.push(['Знакомое состояние','«'+P.ego.top+'»']);
 if(P.archB&&P.archB.lead)L.push(['Привычный ход',P.archB.top]);
 if(P.lab&&P.lab.lead&&window.GPAT&&GPAT[P.lab.lead])L.push(['Установка в работе',GPAT[P.lab.lead].n]);
 var v=(P.focuses&&P.focuses.length?P.focuses:(P.valuesCore&&P.valuesCore.top3)||[]);if(v.length)L.push(['Три направления',v.map(function(x){return typeof x==='string'?x:(x.name||x.label||x.title||'')}).filter(Boolean).join(', ')]);if(P.reactor28&&P.reactor28.day)L.push(['Реактор','День '+P.reactor28.day+' из 28']);
 if(P.fractal&&P.fractal.lever&&P.fractal.lever.title)L.push(['Точка влияния',P.fractal.lever.title]);
 if(P.archD&&P.archD.top&&P.archD.d1t)L.push(['Выбранное состояние',P.archD.top]);
 document.getElementById('pr').innerHTML=L.length?'<div class="pr">'+L.map(function(x){return '<div class="r"><span>'+E(x[0])+'</span><b>'+E(x[1])+'</b></div>'}).join('')+'</div>':'<p class="muted">Портрет появится, когда ты '+'пройдешь'+' первые испытания.</p>';
 GHM.render(document.getElementById('hm'),{});
 /* путь сейчас */
 var s=GRoute.state(P),st=GFLOW[s.index]||{},PT={'0':'Точка 0','А':'Точка А','Б':'Точка Б','С':'Точка С','Финал':'Финал'};
 document.getElementById('nw').innerHTML='<div class="now">'+(s.finished?'<p>Путь этого круга пройден.</p><a class="go" href="tasks.html">Дальше: Задания</a>':'<p class="muted">'+E(PT[st.pt]||'')+'</p><p><b>'+E(st.t||'')+'</b></p><a class="go" href="'+E(s.url)+'">Дальше: '+E(st.t||'Продолжить')+'</a>')+'</div>';
 /* артефакты */
 var A=window.GArts?GArts.list(P):[];
 document.getElementById('ar').innerHTML=A.length?'<div class="arts">'+A.map(function(a){var ic=a.icon||'';return '<div class="art">'+(/\.(png|jpe?g|webp|svg)/.test(ic)?'<img src="'+E(ic)+'" alt="">':'<span class="ic">'+E(ic)+'</span>')+E(a.name)+'</div>'}).join('')+'</div>':'<p class="muted">Артефакты появятся по мере пути.</p>';
 if(location.hash){var t=document.querySelector(location.hash);if(t)setTimeout(function(){t.scrollIntoView()},50)}
});
})();
