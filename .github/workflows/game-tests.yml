name: Game regression tests

on:
  push:
    paths:
      - "game_v5/**"
      - "game_commercial/**"
      - "tests/**"
      - ".github/workflows/game-tests.yml"
  pull_request:
    paths:
      - "game_v5/**"
      - "game_commercial/**"
      - "tests/**"
      - ".github/workflows/game-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package.json
      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        working-directory: tests
        run: npm test

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: tests
        run: npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Run desktop browser smoke tests
        working-directory: tests
        run: npx playwright test --config=playwright.config.cjs

  commercial-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: tests
        run: npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Run commercial edition smoke tests
        working-directory: tests
        run: npx playwright test --config=playwright.commercial.config.cjs
