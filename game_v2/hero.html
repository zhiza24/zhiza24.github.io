document.getElementById('nm').textContent=P.name||(f?'Героиня':'Герой');document.getElementById('who').textContent='Аркан '+RN[n-1]+' · '+A.name;

b.onclick=function(e){var x=e.target.closest('button');if(!x)return;var i=+x.dataset.i;if(i==0&&d>=1){location.href='wheel.html';return}if(t<d&&i==d){document.getElementById('tk').classList.add('on');return}window.gToast?gToast('Скоро'):alert('Скоро')};
