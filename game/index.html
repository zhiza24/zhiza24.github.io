<!doctype html>
<html lang="ru"><head>

<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#211710">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>.entry .ea{position:absolute;left:0;right:0;top:9%;margin:0;text-align:center;font-family:var(--serif);font-size:19px;letter-spacing:.08em;color:var(--sand)}
.entry .eh{font-size:28px;line-height:1.18;bottom:auto;top:calc(44% + 66px + 110px)}
.entry .es{top:calc(44% + 66px + 30px)}</style>
</head><body>
<div class="backdrop" aria-hidden="true"></div>
<main class="phone" id="app"><section class="scr entry dark"><div class="ent">
<p class="ea">Автор: Майя Явь</p>
<p class="eh">ПУТЬ<br>СОВРЕМЕННОГО<br>АЛХИМИКА</p>
<button class="core" id="core" aria-label="Войти"><span class="halo"></span><span class="ring"></span><span class="ring r2"></span><span class="wave"></span></button>
<p class="es">коснитесь</p></div></section></main>
<script>
const c=document.getElementById('core');let AC;
function chime(){try{const A=new (window.AudioContext||window.webkitAudioContext)(),t=A.currentTime,out=A.createGain(),lp=A.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;
out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(.22,t+.25);out.gain.setValueAtTime(.22,t+1.1);out.gain.linearRampToValueAtTime(0,t+2.3);
const dl=A.createDelay();dl.delayTime.value=.24;const fb=A.createGain();fb.gain.value=.3;dl.connect(fb);fb.connect(dl);out.connect(lp);lp.connect(A.destination);out.connect(dl);dl.connect(lp);
const tone=(f,st,d,v)=>{const o=A.createOscillator(),g=A.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+st);g.gain.linearRampToValueAtTime(v,t+st+.12);g.gain.exponentialRampToValueAtTime(.0001,t+st+d);o.connect(g);g.connect(out);o.start(t+st);o.stop(t+st+d+.05)};
tone(220,0,2.2,.10);tone(329.63,0,2.2,.06);
[440,523.25,659.25,830.61,987.77].forEach((f,i)=>tone(f,.1+i*.13,1.8-i*.1,.09));
[1760,2093,2489].forEach((f,i)=>tone(f,.6+i*.11,1.1,.025));
}catch(e){}}
c.onclick=()=>{if(c.classList.contains('go'))return;try{navigator.vibrate&&navigator.vibrate([18,40,28])}catch(e){}chime();c.classList.add('go');setTimeout(()=>location.href='map.html',2400)};
</script></body></html>
