<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Путь Алхимика">
<link rel="apple-touch-icon" href="img/sphere.png">
<title>Путь Современного Алхимика</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 38%,#5a3816 0%,#2e1c0b 45%,#160d05 100%);color:#f6d79a;font-family:'Cormorant Garamond',Georgia,serif;overflow:hidden}
.cover{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 7vh) 20px calc(env(safe-area-inset-bottom) + 6vh);text-align:center}
.author{font-size:clamp(24px,6.5vw,34px);font-weight:600;letter-spacing:1px;color:#f3cf8a;text-shadow:0 0 12px rgba(255,190,90,.5)}
.orb{position:relative;width:min(72vw,46vh);aspect-ratio:1;cursor:pointer;border:0;background:none;padding:0}
.orb img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;animation:pulse 2.6s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(255,190,70,.75))}
.ring{position:absolute;inset:-6%;border-radius:50%;border:3px solid rgba(255,200,100,.55);box-shadow:0 0 30px rgba(255,180,60,.6),inset 0 0 30px rgba(255,180,60,.4);animation:wave 2.6s ease-out infinite}
.ring.r2{animation-delay:1.3s}
.halo{position:absolute;inset:-25%;border-radius:50%;background:radial-gradient(rgba(255,200,90,.45),rgba(255,160,40,0) 62%);animation:glow 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes wave{0%{transform:scale(.95);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
.title{font-size:clamp(36px,10.5vw,56px);font-weight:700;line-height:1.08;letter-spacing:2px;color:#ffe3a3;text-shadow:0 0 18px rgba(255,190,80,.65),0 2px 2px rgba(0,0,0,.6)}
.hint{margin-top:14px;font-size:clamp(19px,5vw,24px);color:#ffe9be;letter-spacing:1px;animation:glow 2.6s ease-in-out infinite}
.flash{position:fixed;inset:0;background:radial-gradient(#fff6d0,#ffcc5c 40%,rgba(255,180,60,0) 75%);opacity:0;pointer-events:none;transition:opacity .5s}
.go .flash{opacity:1}.go .orb img{transform:scale(1.3);transition:transform .5s}
</style></head><body>
<div class="cover">
 <div class="author">Автор: Майя Явь</div>
 <button class="orb" id="orb" aria-label="Начать путь"><div class="halo"></div><div class="ring"></div><div class="ring r2"></div><img src="img/sphere.png" alt=""></button>
 <div><div class="title">ПУТЬ<br>СОВРЕМЕННОГО<br>АЛХИМИКА</div><div class="hint">Коснись сферы, чтобы начать</div></div>
</div>
<div class="flash"></div>
<script>
document.getElementById('orb').onclick=()=>{document.body.classList.add('go');setTimeout(()=>{location.href='map.html'},650)};
</script>
</body></html>
