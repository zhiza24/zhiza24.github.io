<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Путь Современного Алхимика · Майя Явь</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#211710">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="t/style.css">
<style>.entry .ea{position:absolute;left:0;right:0;top:9%;margin:0;text-align:center;font-family:var(--serif);font-size:19px;letter-spacing:.08em;color:var(--sand)}
.entry .eh{font-size:28px;line-height:1.18;bottom:auto;top:calc(44% + 66px + 110px)}
.entry .es{top:calc(44% + 66px + 30px)}</style>
</head><body>
<div class="backdrop" aria-hidden="true"></div>
<main class="phone" id="app"><section class="scr entry dark"><div class="ent">
<p class="ea">Автор: Майя Явь</p>
<p class="eh">ПУТЬ<br>СОВРЕМЕННОГО<br>АЛХИМИКА</p>
<button class="core" id="core" aria-label="Войти"><span class="halo"></span><span class="ring"></span><span class="ring r2"></span><span class="wave"></span></button>
<p class="es">коснитесь</p></div></section></main>
<script>
const c=document.getElementById('core');let AC;
function chime(){try{const A=new (window.AudioContext||window.webkitAudioContext)(),t=A.currentTime,out=A.createGain(),lp=A.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.Q.value=.5;
out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(.32,t+.35);out.gain.setValueAtTime(.32,t+1.2);out.gain.linearRampToValueAtTime(0,t+2.35);out.connect(lp);lp.connect(A.destination);
const tone=(f,st,d,v,type)=>{const o=A.createOscillator(),g=A.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+st);g.gain.linearRampToValueAtTime(v,t+st+.3);g.gain.exponentialRampToValueAtTime(.0001,t+st+d);o.connect(g);g.connect(out);o.start(t+st);o.stop(t+st+d+.05)};
tone(98,0,2.3,.32);tone(98.6,0,2.3,.2);tone(146.8,.05,2.2,.14);tone(196,.25,2,.1);tone(270.4,.25,1.8,.05);tone(65.4,0,2.3,.18,'triangle');
}catch(e){}}
const ES=new Audio('snd/entry.mp3');ES.preload='auto';
c.onclick=()=>{if(c.classList.contains('go'))return;try{navigator.vibrate&&navigator.vibrate([18,40,28])}catch(e){}let gone=0;const go=()=>{if(!gone){gone=1;location.href='map.html'}};try{ES.currentTime=0;const pr=ES.play();ES.onended=go;if(pr&&pr.catch)pr.catch(()=>{chime();setTimeout(go,2400)})}catch(e){chime();setTimeout(go,2400)}c.classList.add('go');setTimeout(go,4300)};
</script></body></html>
