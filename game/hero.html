<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Герой</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#000">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css?v=3">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2a1606;font-family:Manrope,sans-serif;color:#3a220a}
.sc{position:fixed;left:0;right:0;top:0;bottom:calc(78px + env(safe-area-inset-bottom));padding:calc(env(safe-area-inset-top) + 50px) 10px 8px;box-sizing:border-box;display:flex;flex-direction:column;gap:clamp(5px,1vh,9px);overflow:hidden;
background:radial-gradient(ellipse at 50% 35%,#fff6dc 0%,#f6e3b4 45%,#e2c07c 100%);box-shadow:inset 0 0 0 4px #b8843a,inset 0 0 0 6px #f4dc9c,inset 0 0 40px rgba(150,90,20,.45)}
.bloom{position:fixed;inset:0;z-index:80;pointer-events:none;background:radial-gradient(circle at 50% 42%,#fffbe8,#ffd27a 35%,#e0a040 75%);animation:bl 1.6s ease-out forwards}
@keyframes bl{to{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pl{flex:none;position:relative;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-radius:10px;background:linear-gradient(#a8321e,#6e1a0c);border:2px solid #e8c47a;box-shadow:0 0 0 2px #7a4a16,0 4px 14px rgba(120,60,10,.35);color:#ffe9b0;opacity:0;animation:up .7s .8s ease forwards}
.pl .t{flex:1;min-width:0}.pl h1{margin:0;font:700 clamp(24px,3.8vh,32px)/1.05 'Cormorant Garamond',serif;color:#fff1c8;text-shadow:0 0 12px rgba(255,200,100,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl small{display:block;font:600 12px Manrope;color:#f3d08a;letter-spacing:.04em}
.md{flex:none;width:clamp(50px,7.4vh,60px);height:clamp(50px,7.4vh,60px);border-radius:50%;background:radial-gradient(circle at 40% 35%,#fffaf0,#f3dfae 60%,#d9b46a);border:2.5px solid #c99a45;box-shadow:0 0 0 2px #7a4a16,0 0 14px rgba(255,190,90,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#5a3410}
.md b{font:700 clamp(20px,3.2vh,26px)/1 'Cormorant Garamond',serif}.md i{font:700 8.5px Manrope;font-style:normal;letter-spacing:.03em;text-transform:uppercase;margin-top:1px}
.pl .md{width:48px;height:48px}.pl .md b{font-size:20px}
.mid{flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:6px}
.col{flex:none;display:flex;flex-direction:column;justify-content:space-around;height:100%;gap:6px;align-items:center;opacity:0;animation:up .7s 1.3s ease forwards}
.col div.l{font:700 10px Manrope;color:#7a4a16;text-transform:uppercase;letter-spacing:.04em;margin-top:3px;text-align:center}
.pt{flex:1;min-width:0;height:100%;position:relative;border-radius:50% 50% 14px 14px/34% 34% 14px 14px;overflow:hidden;border:3px solid #d9a54e;box-shadow:0 0 0 3px #7a4a16,0 0 0 5px #f0cf86,0 0 30px 6px rgba(255,190,80,.6);background:#f0d090 center 20%/cover;opacity:0;transform:scale(.92);animation:cin 1s 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes cin{to{opacity:1;transform:none}}
.pt .an{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);padding:3px 12px;border-radius:999px;background:linear-gradient(#fff1c8,#d9a54e);border:1.5px solid #7a4a16;font:700 13px 'Cormorant Garamond',serif;color:#3a220a;white-space:nowrap}
.row{flex:none;display:flex;gap:7px;opacity:0;animation:up .7s 1.6s ease forwards}
.pn{position:relative;border-radius:8px;background:linear-gradient(#fffaf0,#f3e3bb);border:1.5px solid #b8843a;box-shadow:inset 0 0 0 3px #fff6dc,inset 0 0 0 4px rgba(184,132,58,.5),0 2px 8px rgba(120,60,10,.25);padding:7px 9px}
.pn h4{margin:0 0 4px;text-align:center;font:700 clamp(15px,2.2vh,17px) 'Cormorant Garamond',serif;color:#8a3a12}
.q{flex:1.15;min-width:0}.q ul{margin:0;padding:0;list-style:none}.q li{display:flex;gap:6px;align-items:center;font:600 clamp(11.5px,1.65vh,13px)/1.3 Manrope;color:#3a220a;padding:1px 0}
.q li:before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:radial-gradient(#ffe08a,#c98a2e);box-shadow:0 0 5px #ffc04a}
.ss{flex:1;display:flex;flex-direction:column;gap:6px}
.sl{flex:1;display:flex;align-items:center;gap:6px;border-radius:8px;border:1.5px solid #b8843a;background:linear-gradient(#fffaf0,#f0d9a2);padding:4px 8px;font:700 clamp(14px,2vh,16px)/1.1 'Cormorant Garamond',serif;color:#5a2a0c;cursor:pointer;box-shadow:0 0 10px rgba(255,190,90,.45);text-align:left}
.sl svg{flex:none;width:30px;height:30px}
.af{flex:none;opacity:0;animation:up .7s 1.8s ease forwards;padding:5px 9px}
.af h4{margin:0 0 4px}.sl6{display:flex;justify-content:space-between}
.sl6 span{width:clamp(30px,4.6vh,38px);height:clamp(30px,4.6vh,38px);border-radius:50%;background:radial-gradient(#fffaf0,#ead2a0);border:2px solid #c99a45;box-shadow:inset 0 2px 5px rgba(120,70,20,.3)}
.go{flex:none;align-self:center;width:min(84%,320px);height:clamp(44px,6.2vh,52px);border-radius:999px;border:2px solid #fff1c8;background:radial-gradient(ellipse at 50% 30%,#fff3cc,#ecc06a 55%,#a5732c);color:#2a1606;font:700 clamp(19px,2.8vh,23px) 'Cormorant Garamond',serif;letter-spacing:.1em;cursor:pointer;box-shadow:0 0 0 2px #7a4a16,0 0 22px rgba(255,180,70,.7);opacity:0;animation:up .7s 2s ease forwards}
.ov{position:fixed;inset:0;z-index:75;display:flex;align-items:center;justify-content:center;background:rgba(40,20,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:auto}
.pp{position:relative;width:min(86vw,360px);max-height:72dvh;display:flex;flex-direction:column;border-radius:14px;padding:26px 22px 22px;box-sizing:border-box;background:linear-gradient(#fdf3d8,#ecd39a);color:#3a220a;border:2px solid #b8843a;box-shadow:0 0 0 6px rgba(120,72,20,.5),0 10px 40px rgba(0,0,0,.5);transform:scaleY(.2);transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
.ov.on .pp{transform:none}
.pp:before,.pp:after{content:"";position:absolute;left:-10px;right:-10px;height:16px;border-radius:8px;background:linear-gradient(#e8c47a,#8a5a20,#c99a45)}
.pp:before{top:-9px}.pp:after{bottom:-9px}
.pp h3{margin:0 0 10px;text-align:center;font:700 26px/1.1 'Cormorant Garamond',serif;color:#6a3e10}
.pp .bd{overflow:auto;font:500 15.5px/1.5 Manrope;-webkit-overflow-scrolling:touch}.pp .bd p{margin:0 0 10px}.pp .bd b{color:#7a4610}
.pp .x{position:absolute;top:6px;right:8px;width:34px;height:34px;border:0;background:none;font:400 28px/1 serif;color:#6a3e10;cursor:pointer}
</style></head>
<body data-page="hero">
<div class="bloom"></div>
<div class="sc">
<div class="pl"><div class="t"><h1 id="role"></h1><small id="who"></small></div><div class="md"><b>1</b><i>уровень</i></div></div>
<div class="mid">
<div class="col"><div><div class="md" id="p0"></div><div class="l">Личность</div></div><div><div class="md" id="p1"></div><div class="l">Интуиция</div></div></div>
<div class="pt" id="pt"><div class="an" id="an"></div></div>
<div class="col"><div><div class="md" id="p2"></div><div class="l">Вызов</div></div><div><div class="md" id="p3"></div><div class="l">Ключ</div></div></div>
</div>
<div class="row"><div class="pn q"><h4>Качества</h4><ul id="ql"></ul></div><div class="ss" id="scr"></div></div>
<div class="pn af"><h4 style="text-align:center;font:700 15px 'Cormorant Garamond',serif;color:#8a3a12">Артефакты</h4><div class="sl6"><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
<button class="go" id="go" type="button">ПРИНЯТЬ ПУТЬ</button>
</div>
<div class="ov" id="ov"><div class="pp"><button class="x" type="button" id="x" aria-label="Закрыть">×</button><h3 id="ph"></h3><div class="bd" id="pb"></div></div></div>
<script src="arcana.js"></script>
<script src="nav.js?v=3"></script>
<script>
var P={};try{P=JSON.parse(localStorage.getItem('alch_profile'))||{}}catch(e){}
function red(n){while(n>22){n=String(n).split('').reduce(function(a,c){return a+ +c},0)}return n}
var mm=/^(\d\d)\.(\d\d)\.(\d{4})$/.exec(P.birth||''),pts=P.points||[];
if(mm){var l=red(+mm[1]),i=+mm[2],v=red(mm[3].split('').reduce(function(a,c){return a+ +c},0));pts=[l,i,v,red(l+i+v)]}
var n=pts[0]||12,A=ARCANA[n-1],f=P.gender=='f',R=ARCANA_ROLE[n]?ARCANA_ROLE[n][f?1:0]:A.epithet;
var RN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII'];
document.getElementById('role').textContent=R;
document.getElementById('who').textContent=(P.name||(f?'Героиня':'Герой'))+' · Аркан '+RN[n-1]+' · '+A.name;
for(var j=0;j<4;j++)document.getElementById('p'+j).innerHTML='<b>'+(pts[j]||'?')+'</b>';
document.getElementById('pt').style.backgroundImage='url(img/hero_'+(f?'f':'m')+'.jpg)';
document.getElementById('an').textContent='Кристалл пути';
var Q=A.light.replace(/\.$/,'').split(/,\s*|\s+и\s+/).filter(Boolean).slice(0,4);
document.getElementById('ql').innerHTML=Q.map(function(q){return '<li>'+q.charAt(0).toUpperCase()+q.slice(1)+'</li>'}).join('');
var SK=P.skill||{},mix=SK.top&&SK.top.length>1,k=mix?'mix':SK.key;
var POW={s:'Твоя сила в том, что ты действуешь сразу. Пока другие сомневаются, ты уже делаешь первый шаг и зажигаешь движение вокруг себя.',
n:'Твоя сила в том, что ты сначала видишь. Ты замечаешь то, что ускользает от других, и поэтому твой шаг всегда точный.',
str:'Твоя сила в том, что ты строишь свое. Ты не идешь чужими тропами, а создаешь путь, по которому потом пойдут другие.',
z:'Твоя сила в том, что ты чувствуешь людей рядом. Ты умеешь идти вместе, держать общий ритм и подхватывать тех, кто рядом.',
mix:'Твоя сила в гибкости. В тебе живут разные способы действовать, и ты выбираешь тот, который нужен прямо сейчас.'};
var L=[{t:'Твоя сила',c:POW[k]?'<p>'+POW[k]+'</p>':'<p>Пройди Колесо судьбы, и этот свиток откроется.</p>'},
{t:'Твой аркан',c:'<p><b>'+A.name+' — '+R+'</b></p><p>'+A.personality+'</p><p><b>Свет.</b> '+A.light+'</p><p>'+A.other+'</p>'}];
var I='<svg viewBox="0 0 48 48"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0c0"/><stop offset="1" stop-color="#d9a04a"/></linearGradient></defs><rect x="10" y="9" width="28" height="30" rx="2" fill="url(#sg)" stroke="#8a5420" stroke-width="1.2"/><rect x="6" y="6" width="36" height="6" rx="3" fill="#c99a45" stroke="#7a4a16"/><rect x="6" y="36" width="36" height="6" rx="3" fill="#c99a45" stroke="#7a4a16"/><path d="M15 18h18M15 23h18M15 28h12" stroke="#8a5420" stroke-width="1.3" stroke-linecap="round"/><circle cx="34" cy="31" r="4" fill="#a8321e" stroke="#6a1a0a"/></svg>';
document.getElementById('scr').innerHTML=L.map(function(s,i){return '<button type="button" class="sl" data-i="'+i+'">'+I+'<span>Свиток<br>'+s.t.toLowerCase().replace(/^т/,'Т')+'</span></button>'}).join('');
var ov=document.getElementById('ov');
document.getElementById('scr').onclick=function(e){var b=e.target.closest('.sl');if(!b)return;var s=L[+b.dataset.i];document.getElementById('ph').textContent=s.t;document.getElementById('pb').innerHTML=s.c;ov.classList.add('on')};
document.getElementById('x').onclick=function(){ov.classList.remove('on')};ov.onclick=function(e){if(e.target==ov)ov.classList.remove('on')};
document.getElementById('go').onclick=function(){location.href='map.html?v=3'};
</script></body></html>
