<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Герой</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#000">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1c1007;color:#f6e7c4;font-family:Manrope,sans-serif}
.sc{position:fixed;left:0;right:0;top:0;bottom:calc(78px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 18px clamp(10px,2vh,18px);box-sizing:border-box;overflow:hidden;
background:radial-gradient(ellipse at 50% 38%,#6e4314 0%,#3a2209 45%,#1c1007 80%)}
.sc:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,214,130,.35),rgba(255,180,80,0) 55%);pointer-events:none}
.bloom{position:fixed;inset:0;z-index:80;pointer-events:none;background:radial-gradient(circle at 50% 42%,#fff8e0,#ffd27a 30%,#c7862e 65%,#1c1007);animation:bl 1.6s ease-out forwards}
@keyframes bl{0%{opacity:1}100%{opacity:0}}
.nm{position:relative;margin:0 44px;text-align:center;font:700 clamp(28px,4.6vh,40px)/1.05 'Cormorant Garamond',serif;color:#ffe9b0;text-shadow:0 0 18px rgba(255,190,90,.55);opacity:0;animation:up .8s .9s ease forwards}
.ar{position:relative;margin-top:4px;text-align:center;font:700 clamp(11px,1.6vh,13px) Manrope;letter-spacing:.18em;text-transform:uppercase;color:#e8c47a;opacity:0;animation:up .8s 1.1s ease forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{position:relative;flex:1 1 auto;min-height:0;max-height:46vh;aspect-ratio:3/4;margin:clamp(8px,1.6vh,16px) 0 0;border-radius:16px;border:2px solid #f0cf86;box-shadow:0 0 0 5px rgba(60,34,8,.9),0 0 0 6.5px #c99a45,0 0 40px 8px rgba(255,190,90,.45);overflow:hidden;
background:radial-gradient(ellipse at 50% 40%,#5a3810,#2a1606);opacity:0;transform:translateY(60px) scale(.9) rotate(-3deg);animation:cin 1.1s 1.2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes cin{to{opacity:1;transform:none}}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .ph{position:absolute;inset:8px;border:1.5px solid rgba(240,207,134,.7);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.card .ph b{font:700 clamp(54px,9vh,80px)/1 'Cormorant Garamond',serif;color:#ffe3a0;text-shadow:0 0 20px rgba(255,190,90,.7)}
.card .ph i{font:600 italic clamp(16px,2.4vh,20px) 'Cormorant Garamond',serif;color:#e8c47a}
.card .rn{position:absolute;left:0;right:0;bottom:0;padding:22px 6px 7px;text-align:center;font:700 clamp(15px,2.2vh,19px) 'Cormorant Garamond',serif;color:#ffe9b0;background:linear-gradient(rgba(20,10,0,0),rgba(20,10,0,.85))}
.ds{position:relative;max-width:330px;margin:clamp(8px,1.4vh,14px) 0 0;text-align:center;font:500 clamp(13px,1.85vh,15px)/1.4 Manrope;color:#f6e7c4;opacity:0;animation:up .8s 1.8s ease forwards}
.scr{position:relative;display:flex;gap:10px;justify-content:center;margin-top:clamp(8px,1.5vh,14px);opacity:0;animation:up .8s 2s ease forwards}
.sl{width:clamp(70px,20vw,82px);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;color:#f3dca8;font:600 11.5px/1.15 Manrope;cursor:pointer}
.sl svg{width:clamp(40px,6vh,50px);height:clamp(40px,6vh,50px);filter:drop-shadow(0 0 6px rgba(255,190,90,.55))}
.sl.lk{opacity:.4;filter:grayscale(.5)}
.go{position:relative;flex:none;margin-top:clamp(10px,1.8vh,18px);width:min(80%,320px);height:clamp(46px,6.6vh,54px);border-radius:999px;border:2px solid #f5dca0;background:radial-gradient(ellipse at 50% 30%,#fff3cc,#ecc06a 55%,#a5732c);color:#2a1606;font:700 clamp(20px,3vh,24px) 'Cormorant Garamond',serif;letter-spacing:.08em;cursor:pointer;box-shadow:0 0 22px rgba(255,190,90,.5);opacity:0;animation:up .8s 2.2s ease forwards}
.ov{position:fixed;inset:0;z-index:75;display:flex;align-items:center;justify-content:center;background:rgba(20,10,0,.6);opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:auto}
.pp{position:relative;width:min(86vw,360px);max-height:72dvh;display:flex;flex-direction:column;border-radius:14px;padding:26px 22px 22px;box-sizing:border-box;background:linear-gradient(#f8ebc8,#ecd39a);color:#3a220a;border:2px solid #b8843a;box-shadow:0 0 0 6px rgba(80,48,14,.6),0 10px 40px rgba(0,0,0,.6);transform:scaleY(.2);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);transform-origin:50% 50%}
.ov.on .pp{transform:none}
.pp:before,.pp:after{content:"";position:absolute;left:-10px;right:-10px;height:16px;border-radius:8px;background:linear-gradient(#c99a45,#8a5a20,#c99a45)}
.pp:before{top:-9px}.pp:after{bottom:-9px}
.pp h3{margin:0 0 10px;text-align:center;font:700 26px/1.1 'Cormorant Garamond',serif;color:#6a3e10}
.pp .bd{overflow:auto;font:500 15.5px/1.5 Manrope;-webkit-overflow-scrolling:touch}
.pp .bd p{margin:0 0 10px}.pp .bd b{color:#7a4610}
.pp .x{position:absolute;top:6px;right:8px;width:34px;height:34px;border:0;background:none;font:400 28px/1 serif;color:#6a3e10;cursor:pointer}
</style></head>
<body data-page="hero">
<div class="bloom"></div>
<div class="sc">
<div class="nm" id="nm"></div>
<div class="ar" id="ar"></div>
<div class="card" id="card"></div>
<div class="ds" id="ds"></div>
<div class="scr" id="scr"></div>
<button class="go" id="go" type="button">ПРИНЯТЬ ПУТЬ</button>
</div>
<div class="ov" id="ov"><div class="pp"><button class="x" type="button" id="x" aria-label="Закрыть">×</button><h3 id="ph"></h3><div class="bd" id="pb"></div></div></div>

<script src="arcana.js"></script>
<script src="nav.js"></script>
<script>
var P={};try{P=JSON.parse(localStorage.getItem('alch_profile'))||{}}catch(e){}
function red(n){while(n>22){n=String(n).split('').reduce(function(a,c){return a+ +c},0)}return n}
var m=/^(\d\d)\./.exec(P.birth||''),n=m?red(+m[1]):(P.points&&P.points[0])||12,A=ARCANA[n-1],f=P.gender=='f',R=ARCANA_ROLE[n]?ARCANA_ROLE[n][f?1:0]:A.epithet;
var RN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII'];
document.getElementById('nm').textContent=P.name||(f?'Героиня':'Герой');
document.getElementById('ar').textContent='Аркан '+RN[n-1]+' · '+R;
document.getElementById('card').innerHTML=(n==12?'<img src="img/hero.jpg" alt="">':'<div class="ph"><b>'+RN[n-1]+'</b><i>'+A.name+'</i></div>')+'<div class="rn">'+A.name+'</div>';
document.getElementById('ds').textContent=A.personality;
var SK=P.skill||{},mix=SK.top&&SK.top.length>1,k=mix?'mix':SK.key;
var POW={s:'Твоя сила в том, что ты действуешь сразу. Пока другие сомневаются, ты уже делаешь первый шаг и зажигаешь движение вокруг себя.',
n:'Твоя сила в том, что ты сначала видишь. Ты замечаешь то, что ускользает от других, и поэтому твой шаг всегда точный.',
str:'Твоя сила в том, что ты строишь свое. Ты не идешь чужими тропами, а создаешь путь, по которому потом пойдут другие.',
z:'Твоя сила в том, что ты чувствуешь людей рядом. Ты умеешь идти вместе, держать общий ритм и подхватывать тех, кто рядом.',
mix:'Твоя сила в гибкости. В тебе живут разные способы действовать, и ты выбираешь тот, который нужен прямо сейчас.'};
var L=[{t:'Твоя сила',c:POW[k]?'<p>'+POW[k]+'</p>':'<p>Пройди Колесо судьбы, и этот свиток откроется.</p>'},
{t:'Твой аркан',c:'<p><b>'+A.name+' — '+R+'</b></p><p>'+A.personality+'</p><p><b>Свет.</b> '+A.light+'</p><p>'+A.other+'</p>'},
{t:'Скоро',lk:1},{t:'Скоро',lk:1}];
var I='<svg viewBox="0 0 48 48"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0c0"/><stop offset="1" stop-color="#d9a04a"/></linearGradient></defs><rect x="10" y="9" width="28" height="30" rx="2" fill="url(#sg)" stroke="#8a5420" stroke-width="1.2"/><rect x="6" y="6" width="36" height="6" rx="3" fill="#c99a45" stroke="#7a4a16"/><rect x="6" y="36" width="36" height="6" rx="3" fill="#c99a45" stroke="#7a4a16"/><path d="M15 18h18M15 23h18M15 28h12" stroke="#8a5420" stroke-width="1.3" stroke-linecap="round"/><circle cx="34" cy="31" r="4" fill="#a8321e" stroke="#6a1a0a"/></svg>';
document.getElementById('scr').innerHTML=L.map(function(s,i){return '<button type="button" class="sl'+(s.lk?' lk':'')+'" data-i="'+i+'">'+I+s.t+'</button>'}).join('');
var ov=document.getElementById('ov');
document.getElementById('scr').onclick=function(e){var b=e.target.closest('.sl');if(!b)return;var s=L[+b.dataset.i];if(s.lk){gToast();return}document.getElementById('ph').textContent=s.t;document.getElementById('pb').innerHTML=s.c;ov.classList.add('on')};
document.getElementById('x').onclick=function(){ov.classList.remove('on')};ov.onclick=function(e){if(e.target==ov)ov.classList.remove('on')};
document.getElementById('go').onclick=function(){location.href='map.html'};
</script></body></html>
