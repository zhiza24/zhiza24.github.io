<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Карта пути</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#5a3a14">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#3a240c}
.map{position:fixed;left:0;right:0;top:0;bottom:calc(78px + env(safe-area-inset-bottom));background:url(img/map_bg.jpg) center/cover no-repeat;overflow:hidden}
.o{position:absolute;transform:translate(-50%,-50%);text-decoration:none}
.ttl{font:700 30px 'Cormorant Garamond',serif;color:#ffe6a8;text-shadow:0 2px 3px #3a0a05;white-space:nowrap}
.step{border-radius:50%;cursor:pointer}
.start{border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 26px 'Cormorant Garamond',serif;color:#ffe6a8;text-shadow:0 2px 3px #000;animation:p 2s infinite}
@keyframes p{0%,100%{box-shadow:0 0 6px 2px rgba(255,211,106,.5)}50%{box-shadow:0 0 26px 10px rgba(255,211,106,.85)}}
.cont{display:flex;align-items:center;justify-content:center;font:700 23px 'Cormorant Garamond',serif;color:#ffe6a8;text-shadow:0 2px 3px #3a0a05;white-space:nowrap}
.info{display:flex;align-items:center;justify-content:center;font:700 30px 'Cormorant Garamond',serif;color:#ffe6a8;border-radius:50%}
</style></head><body data-page="map">
<div class="map" id="m">
<div class="o ttl" data-x="160" data-y="64">Карта пути</div>
<a class="o step" href="#soon" data-x="331" data-y="276" data-r="44"></a>
<a class="o step" href="#soon" data-x="363" data-y="338" data-r="40"></a>
<a class="o step" href="#soon" data-x="323" data-y="463" data-r="50"></a>
<a class="o step" href="#soon" data-x="325" data-y="538" data-r="48"></a>
<a class="o step" href="#soon" data-x="365" data-y="663" data-r="54"></a>
<a class="o start" href="form.html" data-x="287" data-y="850" data-r="94">Старт</a>
<a class="o cont" href="#soon" data-x="282" data-y="950" data-w="240" data-h="52">Продолжить путь</a>
<a class="o info" href="#soon" data-x="458" data-y="950" data-r="56">i</a>
</div>
<script>
function lay(){var m=document.getElementById('m'),W=m.clientWidth,H=m.clientHeight,s=Math.max(W/576,H/1024),ox=(W-576*s)/2,oy=(H-1024*s)/2;
m.querySelectorAll('.o').forEach(function(e){var d=e.dataset;e.style.left=(ox+d.x*s)+'px';e.style.top=(oy+d.y*s)+'px';
if(d.r){e.style.width=e.style.height=(d.r*s)+'px'}if(d.w){e.style.width=d.w*s+'px';e.style.height=d.h*s+'px'}});
var t=m.querySelector('.ttl');t.style.fontSize=Math.min(26,22*s/0.68)+'px'}
addEventListener('resize',lay);lay();
</script>
<script src="nav.js"></script>
</body></html>
