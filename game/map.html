<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Карта пути</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#5a3a14">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#2a1c0c}
.map{position:fixed;left:0;right:0;top:0;bottom:calc(78px + env(safe-area-inset-bottom));background:#2a1c0c url(img/map_bg.jpg?v=5) no-repeat;overflow:hidden}
.o{position:absolute;transform:translate(-50%,-50%);border-radius:50%}
.dock{position:absolute;left:0;right:0;bottom:14px;height:168px}
.cont{position:absolute;transform:translate(-50%,-50%);width:196px;height:56px;font-size:20px!important;animation:p 2.6s infinite;border-radius:14px;background:url(img/btn_plate.png) center/100% 100%;display:flex;align-items:center;justify-content:center;font:700 23px 'Cormorant Garamond',serif;color:#ffe6a8;text-shadow:0 2px 3px #3a0a05;text-decoration:none;white-space:nowrap}
.start{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:92px;height:92px;border-radius:50%;background:url(img/start.png) center/100%;display:flex;align-items:center;justify-content:center;font:700 25px 'Cormorant Garamond',serif;color:#ffe6a8;text-shadow:0 2px 3px #000;text-decoration:none;animation:p 2s infinite}
@keyframes p{0%,100%{box-shadow:0 0 6px 2px rgba(255,211,106,.5)}50%{box-shadow:0 0 26px 10px rgba(255,211,106,.85)}}
.cmp,.inf{position:absolute;bottom:48px;width:70px;height:70px}.cmp{left:12px}.inf{right:12px}
.cmp img,.inf img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}.cmp img{border-radius:50%}
.o.nxt{box-shadow:0 0 0 3px #ffd877,0 0 22px 8px rgba(255,200,90,.75);animation:mN 1.6s ease-in-out infinite}@keyframes mN{50%{box-shadow:0 0 0 3px #fff0b8,0 0 34px 14px rgba(255,200,90,.95)}}
.scl{position:fixed;z-index:76;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);width:min(58vw,240px);height:auto;border:0;padding:0;background:none;cursor:pointer;animation:sclG 2.6s ease-in-out infinite}
.scl img{display:block;width:100%;height:auto}
.scl.op{filter:drop-shadow(0 0 14px rgba(255,210,120,.95))}
.xscl i{position:absolute;left:10px;right:10px;top:4px;bottom:4px;border-radius:4px;background:linear-gradient(#fff0c4,#e3b45c 45%,#a8712c);box-shadow:inset 0 0 0 1px #7a4a16}
.scl i:after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:radial-gradient(#d0462c,#7a1a0a)}
.scl b{position:absolute;top:0;bottom:0;width:14px;border-radius:7px;background:linear-gradient(90deg,#7a4a16,#f3d08a 45%,#8a5420);box-shadow:0 0 0 1px #5a3410}.scl b:first-child{left:0}.scl b:last-child{right:0}
@keyframes sclG{0%,100%{filter:drop-shadow(0 0 5px rgba(255,200,100,.55))}50%{filter:drop-shadow(0 0 12px rgba(255,210,120,.95))}}
.sov{position:fixed;inset:0;z-index:75;display:flex;align-items:flex-start;justify-content:center;padding-top:calc(env(safe-area-inset-top) + 40px);background:rgba(20,10,0,0);pointer-events:none;transition:background .4s}
.sov.on{background:rgba(20,10,0,.55);pointer-events:auto}
.spp{position:relative;width:min(88vw,370px);max-height:0;overflow:hidden;border-radius:6px;background:linear-gradient(#fbf0d2,#ecd39a);color:#3a220a;box-shadow:0 10px 40px rgba(0,0,0,.6);transition:max-height .8s cubic-bezier(.3,.8,.3,1)}
.sov.on .spp{max-height:calc(100dvh - 140px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.spp:before,.spp:after{content:"";position:sticky;display:block;left:0;right:0;height:14px;background:linear-gradient(#e8c47a,#8a5a20,#c99a45);border-radius:7px;z-index:1}
.spp:before{top:0}.spp:after{bottom:0}
.sbd{padding:44px 22px 12px;max-height:calc(100dvh - 200px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:auto;-webkit-overflow-scrolling:touch;font:500 16px/1.55 Manrope}
.sbd h3{margin:0 0 8px;font:700 26px/1.1 'Cormorant Garamond',serif;color:#6a3e10;text-align:center}.sbd p{margin:0 0 10px}.sbd .ft{font-style:italic;color:#8a5a20}
.sx{position:absolute;z-index:2;top:40px;right:8px;width:34px;height:34px;border:0;background:none;font:400 28px/1 serif;color:#6a3e10;cursor:pointer}
.sau{position:absolute;z-index:2;top:44px;left:12px;width:30px;height:30px;border-radius:50%;border:1.5px solid #a8742a;background:radial-gradient(#fff1c8,#d9a54e);color:#3a220a;font:700 15px/1 serif;cursor:pointer;display:none}.sau.on{background:radial-gradient(#ffe08a,#c98a2e);box-shadow:0 0 10px #ffc04a}
</style></head><body data-page="map">
<button class="scl" id="scl" type="button" aria-label="Послание"><img src="img/scroll.webp" alt=""></button>
<div class="sov" id="sov"><div class="spp"><button class="sx" id="sx" type="button" aria-label="Свернуть">×</button><button class="sau" id="sau" type="button" aria-label="Слушать">♪</button><div class="sbd" id="sbd"></div></div></div>
<div class="map" id="m">
<a class="o step" href="#soon" data-x="218" data-y="310" data-r="62"></a>
<a class="o step" href="#soon" data-x="364" data-y="404" data-r="62"></a>
<a class="o step" href="#soon" data-x="218" data-y="519" data-r="62"></a>
<a class="o step" href="#soon" data-x="366" data-y="631" data-r="62"></a>
<a class="o step" href="#soon" data-x="205" data-y="764" data-r="62"></a>
<div class="dock">
<a class="cmp" href="#soon" aria-label="Компас"><img src="img/compass.png" alt=""></a>
<a class="start" href="form.html"><span>Старт</span></a>
<a class="inf" href="#soon" aria-label="Информация"><svg viewBox="0 0 70 70" width="100%" height="100%"><defs><radialGradient id="ig" cx=".4" cy=".35"><stop offset="0" stop-color="#5a3a18"/><stop offset="1" stop-color="#1e120a"/></radialGradient><linearGradient id="ir" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset=".5" stop-color="#e0a940"/><stop offset="1" stop-color="#9a6226"/></linearGradient></defs><circle cx="35" cy="35" r="31" fill="url(#ig)" stroke="url(#ir)" stroke-width="4"/><circle cx="35" cy="35" r="25" fill="none" stroke="url(#ir)" stroke-width="1" stroke-dasharray="2 3"/><text x="35" y="47" text-anchor="middle" font-family="Cormorant Garamond,serif" font-style="italic" font-weight="700" font-size="36" fill="url(#ir)">i</text></svg></a>
</div>
<a class="cont" id="cont" href="#soon" data-x="400" data-y="519">Продолжить путь</a></div>
<script>
function lay(){var m=document.getElementById('m'),W=m.clientWidth,H=m.clientHeight,s=Math.max(W/576,H/1024),ox=(W-576*s)/2,oy=H-1024*s;
m.style.backgroundSize=576*s+'px '+1024*s+'px';m.style.backgroundPosition=ox+'px '+oy+'px';
var c=document.getElementById('cont');c.style.left=Math.min(W-100,ox+400*s)+'px';c.style.top=(oy+519*s)+'px';m.querySelectorAll('.o').forEach(function(e){var d=e.dataset;e.style.left=(ox+d.x*s)+'px';e.style.top=(oy+d.y*s)+'px';e.style.width=e.style.height=(d.r*s)+'px'})}
addEventListener('resize',lay);lay();try{if((JSON.parse(localStorage.getItem('alch_profile'))||{}).skill){var ss=document.querySelectorAll('.o.step');ss[ss.length-1].classList.add('nxt')}}catch(e){}
</script>
<script>
// Текст свитка: заменить здесь
var SCROLL_TITLE='Послание';
var SCROLL_HTML='<p>Приветствую вас, господа пробужденные…</p><p class="ft">Скоро здесь появится авторский текст.</p>';
var SCROLL_AUDIO='snd/author.mp3';
(function(){var o=document.getElementById('sov'),a=document.getElementById('sau'),au=null;
document.getElementById('sbd').innerHTML='<h3>'+SCROLL_TITLE+'</h3>'+SCROLL_HTML;
fetch(SCROLL_AUDIO,{method:'HEAD'}).then(function(r){if(r.ok){au=new Audio(SCROLL_AUDIO);au.onended=function(){a.classList.remove('on')};a.style.display='block'}}).catch(function(){});
a.onclick=function(){if(!au)return;if(au.paused){au.play();a.classList.add('on')}else{au.pause();a.classList.remove('on')}};
function cl(){o.classList.remove('on');document.getElementById('scl').classList.remove('op');if(au){au.pause();a.classList.remove('on')}}
document.getElementById('scl').onclick=function(){o.classList.contains('on')?cl():(o.classList.add('on'),this.classList.add('op'))};
document.getElementById('sx').onclick=cl;o.onclick=function(e){if(e.target==o)cl()};})();
</script>
<script src="nav.js"></script>
</body></html>
