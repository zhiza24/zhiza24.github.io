 // правильные корзины: триггер, реакция, правило, выгода, цена - Эго; новая настройка - Самость

 function dr(){if(i>=6){pp.innerHTML='<div class="pt ok">Готово: '+hit+' из 6 с первого раза. Теперь сотри правило Эго.</div><button class="next" id="nx">Дальше</button>';fb.textContent='';nx.onclick=function(){var P=GPro.load();P.lab.sort=hit;save('Разбор установки',p.n+': '+hit+' из 6',P);location.href=flowNext()};return}

  pp.querySelectorAll('button').forEach(function(b){b.onclick=function(){if(b.dataset.a===ans[i]){fb.textContent='Верно. '+why[i];hit++;i++;setTimeout(dr,700)}else{fb.textContent='Посмотри еще раз: '+why[i];hit=Math.max(0,hit-0);i++;setTimeout(dr,1600)}}})}
 dr()};

 x.globalCompositeOperation='destination-out';var dn=0,cnt=0;function er(e){var b=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;x.beginPath();x.arc(t.clientX-b.left,t.clientY-b.top,26,0,7);x.fill();if(++cnt%15===0)chk();e.preventDefault()}
 function chk(){var d=x.getImageData(0,0,c.width,c.height).data,cl=0;for(var k=3;k<d.length;k+=64)if(!d[k])cl++;if(!dn&&cl/(d.length/64)>.55){dn=1;c.style.transition='opacity .8s';c.style.opacity=0;fb.textContent='Под правилом Эго всегда была Самость.';nx.style.display='block'}}
