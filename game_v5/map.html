<style>
  :root{
    --night:#090b10; --gold:#d9b56d; --gold2:#f3d99b; --text:#f2eadb;
    --scroll-w:min(88vw,360px);
    --scroll-closed-ratio:.35417;
    --scroll-closed-h:calc(var(--scroll-w) * var(--scroll-closed-ratio));
    --scroll-cap-top:calc(var(--scroll-w) * 248 / 604);
    --scroll-cap-bot:calc(var(--scroll-w) * 248 / 604);
    --nav-h:calc(78px + env(safe-area-inset-bottom));
    --top-h:calc(56px + env(safe-area-inset-top));
    --sov-top:calc(env(safe-area-inset-top) + 78px);
    --sov-h:calc(100dvh - env(safe-area-inset-top) - 78px - var(--nav-h));
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--text);font-family:Georgia,"Times New Roman",serif}
  button{font:inherit}
  .vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  .map-screen{position:fixed;left:0;right:0;top:var(--top-h);bottom:var(--nav-h);overflow:hidden}
  .map-stage{position:absolute;height:100%;width:auto;aspect-ratio:784/1168;left:50%;bottom:0;transform:translateX(-50%)}
  .map-img{width:100%;height:100%;object-fit:fill;display:block;pointer-events:none}
  .node{position:absolute;z-index:3;transform:translate(-50%,-50%);width:42px;height:42px;padding:0;border-radius:50%;border:2px solid #f0d18c;background:radial-gradient(circle at 35% 30%,#fff5d0 0%,#f0c870 35%,#c98a40 70%,#8a5420 100%);box-shadow:0 0 0 2px rgba(122,74,22,.85),0 0 16px rgba(255,211,106,.7);color:#3a1a05;cursor:pointer}
  .node .num{display:block;font:700 14px/42px "Cormorant Garamond",serif;text-align:center}
  .node .name,.node .state{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;text-shadow:0 1px 3px #000}
  .node .name{top:108%;font:600 10px/1.2 Manrope,Arial,sans-serif;color:#f1e3c6;opacity:0}
  .node .state{width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .node.current .name,.node:hover .name,.node:focus-visible .name{opacity:1}
  .node.current{animation:p 2s infinite;z-index:5}
  .node.done{box-shadow:0 0 0 2px rgba(122,74,22,.85),0 0 14px rgba(216,189,128,.8)}
  .node.available{border-color:#e5a85e}
  .node.locked{filter:grayscale(.45) brightness(.72);opacity:.78}
  .hero-pin{position:absolute;z-index:4;width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid #f0d18c;background:#2a1a0c;box-shadow:0 0 0 2px #7a4a16,0 0 10px rgba(255,211,106,.8);transform:translate(-50%,calc(-100% - 8px));pointer-events:none}
  .hero-pin img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
  .dock{position:absolute;left:0;right:0;bottom:0;height:158px;pointer-events:none;z-index:45}
  .dock a{pointer-events:auto}
  .start{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff5d0 0%,#f0c870 30%,#c98a40 60%,#8a5420 100%);display:flex;align-items:center;justify-content:center;font:700 24px "Cormorant Garamond",serif;color:#fff8e0;text-shadow:0 2px 3px #000;text-decoration:none;animation:p 2s infinite;box-shadow:0 0 0 3px #7a4a16,0 0 0 6px rgba(201,138,64,.4),0 10px 24px rgba(0,0,0,.5),inset 0 3px 8px rgba(255,240,180,.5)}
  .start:before{content:"";position:absolute;inset:6px;border-radius:50%;border:1.2px dashed rgba(255,230,170,.65);pointer-events:none}
  .cont{position:absolute;left:50%;bottom:108px;transform:translateX(-50%);width:168px;height:48px;border-radius:16px;background:linear-gradient(145deg,#8a5420 0%,#c98a40 40%,#f0c870 70%,#8a5420 100%);display:flex;align-items:center;justify-content:center;font:700 17px "Cormorant Garamond",serif;color:#fff8e0;text-shadow:0 2px 4px #3a1a05;text-decoration:none;white-space:nowrap;box-shadow:0 0 0 2px #5a3410,0 8px 20px rgba(0,0,0,.5),inset 0 2px 6px rgba(255,230,170,.6),inset 0 -3px 6px rgba(0,0,0,.3);animation:p 2.6s infinite}
  .cont:before{content:"";position:absolute;inset:4px;border-radius:12px;border:1px dashed rgba(255,230,170,.6);pointer-events:none}
  .cont[hidden]{display:none}
  .dock a:focus-visible{outline:3px solid #ffe7b0;outline-offset:6px}
  @keyframes p{0%,100%{box-shadow:0 0 6px 2px rgba(255,211,106,.5)}50%{box-shadow:0 0 26px 10px rgba(255,211,106,.85)}}
  .scl{position:fixed;z-index:55;left:50%;top:calc(env(safe-area-inset-top) + 78px);transform:translateX(-50%);width:var(--scroll-w);border:0;padding:0;background:none;cursor:pointer;transition:opacity .45s ease;filter:drop-shadow(0 8px 18px rgba(0,0,0,.55))}
  .scl img{display:block;width:100%;height:auto}
  .scl.op{opacity:0;pointer-events:none}
  .sov{position:fixed;left:0;right:0;top:var(--sov-top);bottom:var(--nav-h);z-index:48;display:flex;justify-content:center;align-items:flex-start;background:rgba(12,8,4,0);pointer-events:none;visibility:hidden;transition:background .45s ease,visibility .45s}
  .sov.ready{visibility:visible;pointer-events:auto}
  .sov.on{background:rgba(12,8,4,.52)}
  .spp{position:relative;width:min(var(--scroll-w),100%);height:var(--scroll-closed-h);max-height:100%;overflow:hidden;flex:none;transition:height .85s cubic-bezier(.22,.8,.28,1)}
  .sov.on .spp{height:100%}
  .spp-art{position:absolute;left:0;top:0;width:100%;height:var(--sov-h);pointer-events:none}
  .spp-top{position:absolute;left:0;top:0;width:100%;height:auto;display:block;z-index:1}
  .spp-bot{position:absolute;left:0;bottom:0;width:100%;height:auto;display:block;z-index:1}
  .spp-mid{position:absolute;left:0;right:0;top:calc(var(--scroll-cap-top) * .68);bottom:calc(var(--scroll-cap-bot) * .48);background:url(img/scroll_open_mid.png?v=h7) center top / 100% auto repeat-y;z-index:0;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 40px,#000 calc(100% - 72px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 40px,#000 calc(100% - 72px),transparent 100%)}
  .sbd{position:absolute;left:14%;right:14%;top:calc(var(--scroll-cap-top) + 8px);bottom:calc(var(--scroll-cap-bot) + 8px);overflow:auto;-webkit-overflow-scrolling:touch;font:500 16px/1.55 Manrope,sans-serif;color:#3a220a;opacity:0;transition:opacity .4s .4s}
  .sov.on .sbd{opacity:1}
  .sbd h3{margin:0 0 8px;font:700 26px/1.1 "Cormorant Garamond",serif;color:#6a3e10;text-align:center}
  .sbd p{margin:0 0 10px}
  .sbd .ft{font-style:italic;color:#8a5a20}
  .sx{position:absolute;z-index:2;top:calc(var(--scroll-w) * 100 / 604 + 4px);right:8%;width:34px;height:34px;border:0;background:none;font:400 28px/1 serif;color:#6a3e10;cursor:pointer}
  .sau{position:absolute;z-index:2;top:calc(var(--scroll-w) * 100 / 604 + 6px);left:8%;width:30px;height:30px;border-radius:50%;border:1.5px solid #a8742a;background:radial-gradient(#fff1c8,#d9a54e);color:#3a220a;font:700 15px/1 serif;cursor:pointer;display:none}
  .sau.on{background:radial-gradient(#ffe08a,#c98a2e);box-shadow:0 0 10px #ffc04a}
  .overlay{position:fixed;inset:0;z-index:80;background:rgba(3,5,8,.76);backdrop-filter:blur(7px);display:none;align-items:flex-end;justify-content:center;padding:16px}
  .overlay.show{display:flex}
  .detail{position:relative;width:min(100%,520px);max-height:min(82vh,720px);overflow:auto;border:1px solid rgba(222,184,111,.48);border-radius:22px 22px 16px 16px;background:radial-gradient(ellipse at 50% 0%,rgba(169,117,49,.14),transparent 45%),linear-gradient(160deg,#1a1e28,#0e1118 72%);box-shadow:0 25px 90px #000b;padding:25px 23px 22px}
  .close{position:absolute;right:15px;top:14px;width:34px;height:34px;border-radius:50%;border:1px solid #76613e;background:#171b23;color:#dfc58f;font:20px Arial,sans-serif;cursor:pointer}
  .detail-kicker{font:10px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#c29b5d;margin:1px 42px 8px 0}
  .detail h2{font-size:clamp(23px,5vw,30px);font-weight:400;color:#f0dfbb;margin:0 0 10px}
  .detail p{font:14px/1.65 Arial,sans-serif;color:#c3b9a8;margin:0 0 17px}
  .progress-head{display:flex;justify-content:space-between;gap:10px;color:#d9c69f;font:11px Arial,sans-serif;margin:18px 0 8px}
  .progress{height:5px;border-radius:8px;background:#34333a;overflow:hidden}
  .progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,#a96c2e,#f0cf86);box-shadow:0 0 12px #d7a85b}
  .reactor-days{display:grid;grid-template-columns:repeat(21,1fr);gap:4px;margin:12px 0 3px}
  .reactor-days i{aspect-ratio:1;border-radius:3px;background:#3d3a3b;border:1px solid #55504a}
  .reactor-days i.done{background:#d0a75e;border-color:#e8c783;box-shadow:0 0 5px #c28c42aa}
  .day-caption{font:10px Arial,sans-serif;color:#928879;margin-top:6px}
  .detail-actions{display:flex;gap:10px;margin-top:22px}
  .continue{flex:1;border:1px solid #d5ae69;border-radius:10px;padding:13px 16px;background:linear-gradient(135deg,#c28b42,#8f5e2d);color:#160f08;font:600 12px Arial,sans-serif;letter-spacing:.06em;cursor:pointer}
  .secondary{border:1px solid #5a5144;border-radius:10px;padding:13px 15px;background:#171b23;color:#d5c5a4;font:12px Arial,sans-serif;cursor:pointer}
  .status-note{margin-top:12px;color:#887f70;font:10px/1.5 Arial,sans-serif}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

<script>
(() => {
  const medalAt={1:[25,87],2:[52,73],3:[50,67.5],4:[49,57.5],5:[56,50.5],6:[47,42.5],7:[53,35],8:[49.5,28]};
  const territories = {
    1:{roman:"I",point:"Точка 0",name:"Ворота рождения",status:"current",description:"Начало путешествия. Здесь герой знакомится со своей исходной точкой, замечает фоновые состояния и получает первые ориентиры.",progress:2,total:4,step:"Продолжить знакомство"},
    2:{roman:"II",point:"Точка А",name:"Земля отражений",status:"done",description:"Исследование внутренних сфер, ценностей, желаний и того, как привычная картина мира отражается в ежедневных решениях.",progress:7,total:7,step:"Территория пройдена"},
    3:{roman:"III",point:"Точка Б",name:"Долина проявлений",status:"available",description:"Наблюдение за реальными ситуациями в разных сферах жизни. Здесь становится заметно, как внутренние правила проявляются в действиях и результатах.",progress:0,total:3,step:"Начать исследование"},
    4:{roman:"IV",point:"Точка Б",name:"Лабиринт повторений",status:"locked",description:"Исследование повторяющихся сценариев, скрытых правил и причин, по которым знакомые ситуации воспроизводятся снова.",progress:0,total:5,step:"Откроется после предыдущей территории"},
    5:{roman:"V",point:"Точка Б",name:"Зеркальная цитадель",status:"locked",description:"Сборка фрактальной карты: увидеть взаимосвязи, опоры и способы защиты, которые влияют на выбор.",progress:0,total:2,step:"Откроется после предыдущей территории"},
    6:{roman:"VI",point:"Точка Б",name:"Кузница выбора",status:"locked",description:"Выбор одной точки влияния и подготовка к практическому эксперименту. Здесь намерение превращается в конкретное действие.",progress:0,total:2,step:"Откроется после предыдущей территории"},
    7:{roman:"VII",point:"Точка С",name:"Реактор преображения",status:"locked",description:"Одна территория и 21 последовательный день наблюдений и экспериментов. Три отрезка помогают увидеть динамику, не превращая календарный пропуск в обнуление пути.",progress:0,total:21,step:"21 день практики",reactor:true},
    8:{roman:"VIII",point:"Финал",name:"Земля мастерства",status:"locked",description:"Возвращение к исходным ориентирам, сравнение результатов и фиксация того, что изменилось в восприятии, решениях и действиях.",progress:0,total:3,step:"Откроется после завершения Реактора"}
  };
  let profile={};
  try{profile=JSON.parse(localStorage.getItem('alch_v5_profile'))||{}}catch(e){}
  const flow=window.GFLOW||[],saved=profile.flow||{};
  const lastIndex=flow.findIndex(x=>x.u===(window.GRoute?GRoute.resume():saved.last));
  const position=lastIndex>=0?lastIndex:Math.max(1,Math.min(Number(saved.max)||1,flow.length-1));
  function territory(step){
    if(step.pt==='0')return 1;if(step.pt==='А')return 2;
    if(step.u==='slot.html?id=pb_intro'||step.u==='slot.html?id=evidence')return 3;
    if(step.u==='slot.html?id=fractal')return 5;
    if(step.u==='slot.html?id=leverage'||step.u==='slot.html?id=guard')return 6;
    if(step.pt==='Б')return 4;if(step.pt==='С')return 7;return 8;
  }
  const currentId=flow[position]?territory(flow[position]):1;
  Object.keys(territories).forEach(key=>{
    const id=Number(key),t=territories[id];
    const steps=flow.map((x,i)=>({x,i})).filter(item=>territory(item.x)===id);
    t.indices=steps.map(item=>item.i);t.total=steps.length;
    t.progress=steps.filter(item=>GRoute.status(item.x.u,profile)==='done').length;
    const seen=steps.some(item=>item.i<position);
    t.status=t.progress===t.total?'done':id===currentId?'current':seen?'available':'locked';
    t.url='tasks.html#block-'+encodeURIComponent(steps[0]?.x.pt||'0');
    if(t.reactor){t.total=21;t.progress=Math.max(0,Math.min(21,Number((profile.reactor||{}).day)||0));}
    const node=document.querySelector('.node[data-id="'+id+'"]');
    const pos=medalAt[id];
    if(pos){node.style.left=pos[0]+'%';node.style.top=pos[1]+'%';}
    node.classList.remove('current','done','available','locked');node.classList.add(t.status);
    node.querySelector('.state').textContent=t.status==='current'?'Ты здесь':t.status==='done'?'Пройдена':t.status==='available'?'Посещена':'Пока закрыта';
    if(t.reactor)node.querySelectorAll('.reactor-meter i').forEach((cell,i)=>cell.classList.toggle('on',i<t.progress));
  });
  const pin=document.getElementById('heroPin');
  if(window.GHeroApply)GHeroApply();
  const pinImg=pin&&pin.querySelector('img');
  if(pinImg&&!pinImg.getAttribute('src'))pinImg.src=window.GHeroSrc?GHeroSrc('portrait'):'img/hero_m_portrait.jpg?v=h3';
  const pinAt=medalAt[currentId];
  if(pin&&pinAt){pin.style.left=pinAt[0]+'%';pin.style.top=pinAt[1]+'%';pin.hidden=false;}
  const checkpoint=GRoute.state(profile),cta=document.getElementById('resume');
  const started=position>1||Object.keys(saved.completed||{}).length>0||
    ['name','birth','points','mapStyle','ego','wheel','wheelTest','mirrors','passport'].some(key=>profile[key]&&(!(Array.isArray(profile[key]))||profile[key].length))||
    Number(profile.reactor?.day)>0||Object.keys(profile.reactor?.days||{}).length>0;
  cta.hidden=!started;
  cta.textContent=checkpoint.finished?'Посмотреть пройденное':'Продолжить игру';
  cta.href=checkpoint.finished?'tasks.html':checkpoint.url;
  const start=document.getElementById('start');
  const beginning=started?'form.html?opening=1&v=opening2':'form.html';
  start.href=started?beginning:'form.html';
  const statusNames={current:"Текущая",done:"Пройдена",available:"Посещена",locked:"Закрыта"};
  const overlay=document.getElementById("overlay");
  const title=document.getElementById("detailTitle");
  const kicker=document.getElementById("detailKicker");
  const description=document.getElementById("detailDescription");
  const progressText=document.getElementById("progressText");
  const progressBar=document.getElementById("progressBar");
  const note=document.getElementById("statusNote");
  const reactorDetail=document.getElementById("reactorDetail");
  const reactorDays=document.getElementById("reactorDays");
  let selected=1;

  function openTerritory(id){
    const t=territories[id]; if(!t)return;
    selected=id;
    title.textContent=t.name;
    kicker.textContent=`Территория ${t.roman} · ${t.point} · ${statusNames[t.status]}`;
    description.textContent=t.description;
    progressText.textContent=t.reactor?`${t.progress} из 21 дней`:`${t.progress} из ${t.total} подтвержденных шагов`;
    progressBar.style.width=(t.progress/t.total*100)+"%";
    reactorDetail.hidden=!t.reactor;
    reactorDays.replaceChildren();
    if(t.reactor){
      for(let i=1;i<=21;i++){
        const cell=document.createElement("i");
        if(i<=t.progress)cell.className="done";
        cell.title=`День ${i}`;
        reactorDays.append(cell);
      }
    }
    const button=document.getElementById("continue");
    button.textContent=t.status==="locked"?"Территория закрыта":t.status!=="current"?"Смотреть результаты":"Продолжить путь";
    button.disabled=t.status==="locked";
    button.style.opacity=button.disabled?".55":"1";
    button.style.cursor=button.disabled?"not-allowed":"pointer";
    note.textContent=t.status==="locked"?"Продолжай путь по текущей территории.":"Здесь сохраняется твой путь. К прежним результатам можно возвращаться в дневнике.";
    overlay.classList.add("show");
    document.getElementById("close").focus();
  }
  function close(){overlay.classList.remove("show")}
  document.querySelectorAll(".node").forEach(node=>node.addEventListener("click",()=>openTerritory(Number(node.dataset.id))));
  document.getElementById("close").addEventListener("click",close);
  document.getElementById("closeSecondary").addEventListener("click",close);
  overlay.addEventListener("click",e=>{if(e.target===overlay)close()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
  document.getElementById("continue").addEventListener("click",()=>{if(territories[selected].status!=="locked")location.href=territories[selected].url});
})();
</script>
<script>
var SCROLL_TITLE='Послание';
var SCROLL_HTML='<p>Приветствую вас, господа пробужденные…</p><p class="ft">Скоро здесь появится авторский текст.</p>';
var SCROLL_AUDIO='snd/author.mp3';
(function(){
  var o=document.getElementById('sov'),a=document.getElementById('sau'),scl=document.getElementById('scl'),au=null,hideT=null;
  document.getElementById('sbd').innerHTML='<h3>'+SCROLL_TITLE+'</h3>'+SCROLL_HTML;
  fetch(SCROLL_AUDIO,{method:'HEAD'}).then(function(r){if(r.ok){au=new Audio(SCROLL_AUDIO);au.onended=function(){a.classList.remove('on')};a.style.display='block'}}).catch(function(){});
  a.onclick=function(){if(!au)return;if(au.paused){au.play();a.classList.add('on')}else{au.pause();a.classList.remove('on')}};
  function cl(){
    o.classList.remove('on');
    scl.classList.remove('op');
    if(au){au.pause();a.classList.remove('on')}
    clearTimeout(hideT);
    hideT=setTimeout(function(){if(!o.classList.contains('on'))o.classList.remove('ready')},900);
  }
  function op(){
    clearTimeout(hideT);
    o.classList.add('ready');
    scl.classList.add('op');
    requestAnimationFrame(function(){requestAnimationFrame(function(){o.classList.add('on')})});
  }
  scl.onclick=function(){o.classList.contains('on')||o.classList.contains('ready')?cl():op()};
  document.getElementById('sx').onclick=cl;
  o.onclick=function(e){if(e.target==o)cl()};
})();
</script>
</body>
