<!doctype html>
<html lang="ru">
<head>
<script src="theme.js?v=9"></script>
<script src="sound.js?v=1"></script>
<script src="flow.js?v=im1"></script>
<script src="opening.js?v=opening2"></script>
<script src="route.js?v=im3"></script>
<script src="profile-layer.js?v=art1"></script>
<script src="gender.js?v=2"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#211710">
<script src="upd.js?v=1794512684"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" href="favicon.svg">
<title>Открытия — Путь Алхимика</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css?v=map1">
<link rel="stylesheet" href="learning.css?v=lo2">
<script src="learning-data.js?v=lo2"></script>
<script src="learning-engine.js?v=lo2"></script>
</head>
<body class="lo-body" data-page="learning">
<div class="lo-wrap" id="learning-app">
  <header class="lo-head">
    <span class="lo-kicker">ПУТЬ АЛХИМИКА · БИБЛИОТЕКА</span>
    <h1>Открытия</h1>
    <p>Короткие исследования, которые помогают замечать закономерности и применять их в жизни.</p>
  </header>
  <main class="lo-main" id="learning-list"></main>
</div>
<script src="nav.js?v=lo2"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('learning-app');
  var root = document.getElementById('learning-list');
  var data = window.GLearning.data;
  var progress = window.GLearning.getProgress();
  function esc(s) {
    return String(s).replace(/[&<>'"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  root.innerHTML =
    '<section class="lo-panel"><div class="lo-label">ТВОЙ ПУТЬ ПОНИМАНИЯ</div>' +
    '<h2>' + progress.completed.length + ' из ' + data.length + ' открытий пройдено</h2>' +
    '<p class="lo-note">Можно возвращаться к любому материалу. Здесь нет оценок и обязательного темпа.</p></section>' +
    data.map(function (x) {
      var done = progress.completed.indexOf(x.id) >= 0;
      return '<a class="lo-panel lo-item" href="learning.html?opening=' + encodeURIComponent(x.id) + '" style="display:block;text-decoration:none;color:inherit">' +
        '<div class="lo-label">' + (done ? '✓ ПРОЙДЕНО' : 'МИНИ-ОБУЧЕНИЕ') + ' · ' + x.minutes + ' МИН</div>' +
        '<h2>' + esc(x.title) + '</h2>' +
        '<p class="lo-note">' + esc(x.subtitle) + '</p>' +
        '<span class="lo-library">Открыть →</span></a>';
    }).join('');

  var id = new URLSearchParams(location.search).get('opening');
  if (id) {
    var item = window.GLearning.getLesson(id);
    if (item) {
      document.title = item.title + ' — Открытия';
      window.GLearning.render(app, id);
    }
  }
})();
</script>
</body>
</html>
