<style>html{background:#0c0804}html,body{margin:0;min-height:100%}body{min-height:100vh;background:radial-gradient(ellipse at 50% 40%,#2a1808,#0c0804 70%) fixed;color:#f4ecdf;font-family:Manrope,sans-serif;text-align:center;overflow:hidden}

<script>(function(){
/* Дыхательная пауза без задержек: одно нажатие, вдох 4 с, выдох 5 с. */
var IN=4,OUT=5,T=IN+OUT,C=804.25,R=128,t0=0,run=false,doneF=false,ph=document.getElementById('ph'),hl=document.getElementById('hl'),ln=document.getElementById('ln'),dt=document.getElementById('dt'),hint=document.getElementById('hint');
function draw(f){ln.setAttribute('stroke-dashoffset',String(C*(1-f)));var a=f*2*Math.PI;dt.setAttribute('cx',140+R*Math.cos(a));dt.setAttribute('cy',140+R*Math.sin(a))}
function phase(s){if(ph.dataset.s===s)return;ph.dataset.s=s;ph.textContent=s;hl.classList.remove('in','out');void hl.offsetWidth;hl.classList.add(s==='Вдох'?'in':'out');try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}}
function fin(){doneF=true;draw(1);hl.classList.remove('in','out');ph.textContent='Я есмь';hint.textContent='';try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
 setTimeout(function(){location.href=(window.GReview||new URLSearchParams(location.search).get('preview')==='1')?'tasks.html':GRoute.advance()},1400)}
function tick(){var t=(performance.now()-t0)/1000;if(t>=T){fin();return}draw(t/T);phase(t<IN?'Вдох':'Выдох');requestAnimationFrame(tick)}
hl.onclick=function(){if(run||doneF)return;run=true;hint.textContent='';t0=performance.now();requestAnimationFrame(tick)};
})();</script><script src="engine.js?v=p1"></script><script src="passport-data.js?v=1"></script><script src="passport.js?v=opening2"></script><script src="texts.js?v=mf4"></script><script src="texts_fr.js?v=mf2"></script><script src="nav.js?v=r3f19"></script></body></html>
