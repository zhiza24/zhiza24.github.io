<body data-page="task">
<div class="n" id="n"></div>
<div class="stage"><div class="c" id="c" role="button" aria-label="Коснись сферы"></div></div>
<h2>Часть пути пройдена.<br>Переведи дыхание</h2>
<div class="t" id="t">Коснись сферы</div>
<div class="s" id="s"></div>
<script>
/* Сфера e6702a2: запуск по касанию, дальше сама. Вдох 4 с (scale 1.7), выдох 6 с (scale 1), 3 цикла, без фазы паузы. Счет сверху, надпись снизу. */
var P=[['Вдох',4,1.7],['Выдох',6,1]],cy=0,ph=0,doneF=false,started=false;
function fin(){
  if(doneF)return;
  doneF=true;
  t.textContent='Я есмь';
  n.textContent='';
  s.textContent='';
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  setTimeout(function(){
    location.href=(window.GReview||new URLSearchParams(location.search).get('preview')==='1')?'tasks.html':GRoute.advance();
  },1400);
}
function run(){
  if(ph>=P.length){
    ph=0;cy++;
    if(cy>=3){fin();return}
    s.textContent='цикл '+(cy+1)+' из 3';
  }
  var p=P[ph],k=p[1];
  t.textContent=p[0];
  c.style.transitionTimingFunction='ease-in-out';
  c.style.transitionDuration=k+'s';
  c.style.transform='scale('+p[2]+')';
  try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
  (function tk(){
    n.textContent=k;
    if(--k>0)setTimeout(tk,1000);
    else setTimeout(function(){ph++;run()},1000);
  })();
}
function start(e){
  if(started||doneF)return;
  if(e)e.preventDefault();
  started=true;
  s.textContent='цикл 1 из 3';
  run();
}
c.addEventListener('pointerdown',start,{passive:false});
</script>
