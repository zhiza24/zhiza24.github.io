<style>
html,body,a,button,.hl,svg{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;outline:none}
a:focus,button:focus,.hl:focus,a:focus-visible,button:focus-visible,.hl:focus-visible,svg:focus{outline:none}
html,body{margin:0;min-height:100%;background:#0c0804;color:#f4ecdf;font-family:Manrope,sans-serif;font-size:17px;line-height:1.45;text-align:center}
.w{max-width:420px;margin:0 auto;padding:calc(64px + env(safe-area-inset-top)) 16px 120px}
h2{font:700 26px/1.2 'Cormorant Garamond',serif;color:#ffe9a8;margin:0 0 10px}
.tri{width:260px;height:230px;overflow:visible}
.ph{font:800 22px Manrope;color:#ffd877;min-height:30px;margin:6px 0}
.hl{position:relative;z-index:70;width:130px;height:130px;margin:10px auto 0;border-radius:50%;border:3px solid #fff0b8;background:radial-gradient(circle at 35% 30%,#fff5d0,#e0a940 55%,#8a5420);color:#2a1606;font:800 19px Manrope;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px #ffcf5a;touch-action:none;cursor:pointer;transition:transform .3s;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;outline:none}
.hl.go{transform:scale(1.12)}
.hint{color:#c9a46a;font-size:17px;margin-top:10px}
@media (max-height:720px){
  .w{padding-top:calc(58px + env(safe-area-inset-top));padding-bottom:110px}
  h2{margin-bottom:6px}

  .hint{margin-top:8px}

</style>
<link rel="stylesheet" href="nav.css?v=h9f19">
</head><body data-page="task">
<div class="w">
<h2>Кусочек пути пройден.<br>Переведи дыхание</h2>
<svg class="tri" viewBox="0 0 260 230">
  <path id="tr" d="M130 20 L240 200 L20 200 Z" fill="none" stroke="#c9a46a" stroke-width="3"/>
  <text x="200" y="100" fill="#e8cf9a" font-size="17">Вдох 4</text>
  <text x="130" y="222" fill="#e8cf9a" font-size="17" text-anchor="middle">Пауза 2</text>
  <text x="10" y="100" fill="#e8cf9a" font-size="17">Выдох 6</text>
  <circle id="dt" r="9" fill="#ffe9a8" style="filter:drop-shadow(0 0 6px #ffcf5a)" cx="130" cy="20"/>
</svg>
<div class="ph" id="ph">Зажми кнопку</div>
<div class="hl" id="hl" role="button" aria-label="Зажми">Зажми</div>
<div class="hint" id="hint">Держи, пока точка обходит треугольник</div>
</div>
<script>
var T=12,t=0,ti,last,V=[[130,20],[240,200],[20,200],[130,20]],D=[4,2,6];
function pos(t){
  var a=0;
  for(var i=0;i<3;i++){
    if(t<=a+D[i]||i==2){
      var f=Math.min(1,(t-a)/D[i]),p=V[i],q=V[i+1];
      return [p[0]+(q[0]-p[0])*f,p[1]+(q[1]-p[1])*f,i,Math.ceil(a+D[i]-t)];
    }
    a+=D[i];
  }
}
function tick(){
  var n=performance.now();
  t+=(n-last)/1000;
  last=n;
  if(t>=T){
    t=T;
    clearInterval(ti);ti=null;
    dt.setAttribute('cx',130);dt.setAttribute('cy',20);
    ph.textContent='Я есмь';hl.textContent='✓';
    try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
    setTimeout(function(){
      location.href=(window.GReview||new URLSearchParams(location.search).get('preview')==='1')?'tasks.html':GRoute.advance();
    },1400);
    return;
  }
  var p=pos(t);
  dt.setAttribute('cx',p[0]);dt.setAttribute('cy',p[1]);
  ph.textContent=['Вдох','Пауза','Выдох'][p[2]]+' · '+p[3];
}
hl.onpointerdown=function(e){
  e.preventDefault();
  if(t>=T)return;
  if(hl.setPointerCapture)try{hl.setPointerCapture(e.pointerId)}catch(err){}
  hl.classList.add('go');
  last=performance.now();
  if(!ti)ti=setInterval(tick,50);
};
function pause(){
  clearInterval(ti);ti=null;
  hl.classList.remove('go');
  if(t<T)ph.textContent='Держи кнопку';
}
hl.onpointerup=hl.onpointercancel=pause;
hl.onlostpointercapture=pause;
</script>
