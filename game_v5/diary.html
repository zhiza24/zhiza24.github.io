<!doctype html><html lang="ru"><head><script src="flow.js?v=r3"></script><script src="opening.js?v=opening2"></script><script src="route.js?v=r3"></script><script src="profile-layer.js?v=2"></script><script src="route-gate.js?v=r3"></script><script src="gender.js?v=1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Дневник</title><script src="upd.js?v=1794440709"></script><link rel="stylesheet" href="nav.css?v=h9f19"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#0c0804;color:#f4ecdf;font-family:Manrope,sans-serif;font-size:19px}.wrap{max-width:560px;margin:auto;padding:calc(64px + env(safe-area-inset-top)) 14px 120px}h1{font-size:26px;color:#f0c870;margin:0 0 12px}.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:6px;margin-bottom:14px}.tabs button{font:700 17px Manrope;padding:10px 4px;border-radius:12px;border:1px solid #a98954;background:#392a18;color:#fff3da;cursor:pointer}.tabs button.on{background:#e8c16c;color:#26190b}.e{background:#20170e;border:1px solid #5a4325;border-radius:14px;padding:14px;margin:10px 0;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.dt{font-size:17px;color:#bfa77f;margin-bottom:4px}.e b{color:#f0c870}textarea{width:100%;min-height:110px;font:500 19px/1.5 Manrope,sans-serif;color:#f4ecdf;background:#1a120a;border:1px solid #a98954;border-radius:14px;padding:12px;resize:vertical}.add{width:100%;margin-top:8px;min-height:50px;border:0;border-radius:12px;background:#edc879;color:#291a08;font:800 19px Manrope;cursor:pointer}.muted{color:#bfa77f}.del{float:right;background:none;border:0;color:#bfa77f;font-size:18px;cursor:pointer}
</style></head><body data-page="diary"><main class="wrap"><h1>Дневник</h1><div class="tabs" id="tb"></div><section id="c"></section></main><script src="engine.js?v=p1"></script><script src="passport-data.js?v=1"></script><script src="passport.js?v=opening2"></script><script src="texts.js?v=mf4"></script><script src="texts_fr.js?v=mf2"></script><script src="nav.js?v=r3f19"></script><script>
var P={};try{P=JSON.parse(localStorage.getItem('alch_v5_profile'))||{}}catch(e){}P.diary=P.diary||{};P.diary.q=P.diary.q||[];P.diary.ins=P.diary.ins||[];
function save(){localStorage.setItem('alch_v5_profile',JSON.stringify(P))}
var T=[['ins','Инсайты'],['q','Вопросы'],['path','Путь'],['tests','Тесты'],['cycles','Циклы']],cur=new URLSearchParams(location.search).get('tab')||'ins';
function esc(x){return String(x==null?'':x).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function dt(t){var d=new Date(t);return isNaN(d)?(t||''):d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function card(head,body){return '<div class="e">'+(head?'<div class="dt">'+head+'</div>':'')+body+'</div>'}
function render(){document.getElementById('tb').innerHTML=T.map(function(t){return '<button data-t="'+t[0]+'" class="'+(t[0]===cur?'on':'')+'">'+t[1]+'</button>'}).join('');var c=document.getElementById('c'),h='';
if(cur==='ins'||cur==='q'){var L=P.diary[cur];h='<textarea id="tx" placeholder="'+(cur==='ins'?'Запиши свою мысль или открытие':'Запиши вопрос, который хочется разобрать')+'"></textarea><button class="add" id="ad">Записать</button>';if(!L.length)h+='<p class="muted">Пока записей нет.</p>';L.slice().reverse().forEach(function(e,j){h+='<div class="e"><button class="del" data-d="'+(L.length-1-j)+'" aria-label="Удалить">×</button><div class="dt">'+dt(e.d)+(e.at?' · '+esc(e.at):'')+'</div>'+esc(e.x)+'</div>'})}
else if(cur==='cycles'){var cycles=P.cycleHistory||[];if(!cycles.length)h='<p class="muted">Здесь появятся завершенные циклы. Новый цикл не стирает прежний.</p>';cycles.slice().reverse().forEach(function(cy){var cp=cy.profile||{},rc=cp.reactor||{};h+=card('Круг '+cy.cycle+' · '+dt(cy.closedAt),'<b>'+esc((window.GPAT&&GPAT[cy.lead]||{}).n||cy.lead)+'</b><br>Засчитано дней: '+esc(rc.day||0)+' / 21<br>Исходное колесо: '+esc((cp.wheel||[]).join(', '))+'<br>Повторное колесо: '+esc(((cp.retest||{}).wheel||[]).join(', '))+'<br>Артефакты: '+esc((cp.arts||[]).map(function(a){return window.GArts?GArts.label(a):(typeof a==='object'?(a.n||a.name||a.id||JSON.stringify(a)):a)}).join(', ')))})}
else if(cur==='path'){var lg=(P.log||[]).slice().reverse();if(!lg.length)h='<p class="muted">Здесь сами появятся шаги пути, ответы и выборы.</p>';lg.forEach(function(e){h+=card(dt(e.d||e.t),e.x?esc(e.x):'<b>'+esc(e.t)+'</b><br>'+esc(e.r))})}
else{var N=['Здоровье','Финансы','Карьера','Отношения','Семья','Друзья','Рост','Отдых'];
if(P.passport)h+=card('Паспорт героя','Девять позиций: '+Object.keys(P.passport.layers.positions).map(function(k){return k+' '+P.passport.layers.positions[k]}).join(' · ')+'<br>Сохранено ответов: '+Object.keys(P.passport.answers||{}).length+'<br><a href="hero.html" style="color:#f0c870">Открыть паспорт</a>');
var mirrors=(P.mirrors||{}).history||[];mirrors.slice().reverse().forEach(function(r){h+=card('Два зеркала · '+dt(r.completed_at),esc(r.main_observation.option_id==='custom'?r.main_observation.custom_answer:r.main_observation.selected_text)+(r.personal_note?'<br>'+esc(r.personal_note):'')+'<br><a style="color:#f0c870" href="slot.html?id=mirrors&amp;review='+encodeURIComponent(r.id)+'">Посмотреть оба зеркала</a>')});
if(P.name||P.birth)h+=card('Инициация','Имя: '+esc(P.name)+'<br>Дата рождения: '+esc(P.birth));
if(P.mapStyle)h+=card('Выбор карты',esc(typeof P.mapStyle==='object'?JSON.stringify(P.mapStyle):P.mapStyle));
if(P.hand||P.handTop)h+=card('Мост',esc(P.handTop||JSON.stringify(P.hand)));
if(P.ego)h+=card('Фоновое состояние',esc(typeof P.ego==='object'?(P.ego.top||P.ego.lead||JSON.stringify(P.ego)):P.ego));
if(P.dq)h+=card('Свайп хорошего',esc(typeof P.dq==='object'?JSON.stringify(P.dq):P.dq));
if(P.res||P.body)h+=card('Ресурсы и тело',esc(JSON.stringify(P.res||''))+' '+esc(JSON.stringify(P.body||'')));
if(Array.isArray(P.wheel))h+=card('Колесо: первый взгляд',N.map(function(n,i){return n+': '+P.wheel[i]}).join('<br>'));
var wt=P.wheelTest;if(wt&&wt.spheres)h+=card('Колесо: по ответам',wt.spheres.map(function(s){return esc(s.name)+': '+(s.average==null?'нет':Number(s.average.toFixed(1)))}).join('<br>'));
if(P.values&&P.values.order&&P.values.order.length)h+=card('Иерархия ценностей',P.values.order.map(function(v,i){return (i+1)+'. '+esc(v)}).join('<br>'));
if(P.egoSelf&&P.egoSelf.match!=null)h+=card('Эго или Самость','Совпало с подсказкой: '+P.egoSelf.match+' из 10');
if(P.focuses&&P.focuses.length)h+=card('Три направления на месяц',P.focuses.map(function(v,i){return (i+1)+'. '+esc(v)}).join('<br>'));
if(P.arts&&P.arts.length)h+=card('Артефакты',esc(P.arts.map(function(a){return window.GArts?GArts.label(a):(typeof a==='object'?(a.n||a.name||JSON.stringify(a)):a)}).join(', ')));
if(!h)h='<p class="muted">Здесь соберутся результаты всех тестов.</p>'}
c.innerHTML=h;var ad=document.getElementById('ad');if(ad)ad.onclick=function(){var v=document.getElementById('tx').value.trim();if(!v)return;var i=gIdx&&document.referrer?'':'';P.diary[cur].push({x:v,d:Date.now(),at:sessionStorage.getItem('alch_v5_gLastStep')||''});save();render()};
c.querySelectorAll('.del').forEach(function(b){b.onclick=function(){P.diary[cur].splice(+b.dataset.d,1);save();render()}});
document.querySelectorAll('#tb button').forEach(function(b){b.onclick=function(){cur=b.dataset.t;render()}})}
render();
</script><div id="backup" style="max-width:560px;margin:0 auto;padding:0 16px 120px;display:flex;gap:8px"><button onclick="GPro.exportFile()" style="flex:1;min-height:44px;border-radius:10px;border:1px solid #9e783a;background:#20170e;color:#f4ecdf;font:700 17px Manrope">Сохранить копию</button><label style="flex:1;min-height:44px;border-radius:10px;border:1px solid #9e783a;background:#20170e;color:#f4ecdf;font:700 17px Manrope;display:flex;align-items:center;justify-content:center">Восстановить<input type="file" accept=".json" hidden onchange="GPro.importFile(this.files[0],function(o){alert(o?'Прогресс восстановлен':'Файл не подошел');location.reload()})"></label></div></body></html>
