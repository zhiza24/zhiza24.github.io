var P={};try{P=JSON.parse(localStorage.getItem('alch_v5_profile'))||{}}catch(e){}P.diary=P.diary||{};P.diary.q=P.diary.q||[];P.diary.ins=P.diary.ins||[];

var T=[['ins','Инсайты'],['q','Вопросы'],['path','Путь'],['tests','Тесты'],['cycles','Циклы'],['book','Книга Алхимика']],cur=new URLSearchParams(location.search).get('tab')||'ins';
function esc(x){return String(x==null?'':x).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function dt(t){var d=new Date(t);return isNaN(d)?(t||''):d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}

function render(){document.getElementById('tb').innerHTML=T.map(function(t){return '<button data-t="'+t[0]+'" class="'+(t[0]===cur?'on':'')+'">'+t[1]+'</button>'}).join('');var c=document.getElementById('c'),h='',wrap=document.querySelector('.wrap');if(wrap)wrap.classList.toggle('dbk-on',cur==='book');if(cur!=='book'&&window.GBook)GBook.close();
if(cur==='ins'||cur==='q'){var L=P.diary[cur];h='<textarea id="tx" placeholder="'+(cur==='ins'?'Запиши свою мысль или открытие':'Запиши вопрос, который хочется разобрать')+'"></textarea><button class="add" id="ad">Записать</button>';if(!L.length)h+='<p class="muted">Пока записей нет.</p>';L.slice().reverse().forEach(function(e,j){h+='<div class="e"><button class="del" data-d="'+(L.length-1-j)+'" aria-label="Удалить">×</button><div class="dt">'+dt(e.d)+(e.at?' · '+esc(e.at):'')+'</div>'+esc(e.x)+'</div>'})}
else if(cur==='cycles'){var cycles=P.cycleHistory||[];if(!cycles.length)h='<p class="muted">Здесь появятся завершенные циклы. Новый цикл не стирает прежний.</p>';cycles.slice().reverse().forEach(function(cy){var cp=cy.profile||{},rc=cp.reactor||{};h+=card('Круг '+cy.cycle+' · '+dt(cy.closedAt),'<b>'+esc((window.GPAT&&GPAT[cy.lead]||{}).n||cy.lead)+'</b><br>Засчитано дней: '+esc(rc.day||0)+' / 21<br>Исходное колесо: '+esc((cp.wheel||[]).join(', '))+'<br>Повторное колесо: '+esc(((cp.retest||{}).wheel||[]).join(', '))+'<br>Артефакты: '+esc((cp.arts||[]).map(function(a){return window.GArts?GArts.label(a):(typeof a==='object'?(a.n||a.name||a.id||JSON.stringify(a)):a)}).join(', ')))})}
else if(cur==='book'){h=''}
else if(cur==='path'){var lg=(P.log||[]).slice().reverse();if(!lg.length)h='<p class="muted">Здесь сами появятся шаги пути, ответы и выборы.</p>';lg.forEach(function(e){h+=card(dt(e.d||e.t),e.x?esc(e.x):'<b>'+esc(e.t)+'</b><br>'+esc(e.r))})}
else{if(window.GHM&&!window._hmR){window._hmR=1;GHM.ready(function(){render()});h='<p class="muted">Загружаю результаты…</p>'}else if(window.GHM){GHM.css();var D=GHM.done(P);D.forEach(function(x){h+='<div class="e hm-it" style="white-space:normal"><div class="dt">'+esc(x.name)+' · уровень '+x.lv+'</div>'+x.html+(x.key==='mirrors'&&(P.mirrors||{}).history&&P.mirrors.history.length?'<p><a style="color:#f0c870" href="slot.html?id=mirrors&amp;review='+encodeURIComponent(P.mirrors.history[P.mirrors.history.length-1].id)+'">Посмотреть оба зеркала</a></p>':'')+'</div>'});if(D.length)h='<p class="muted" style="white-space:normal">Результаты появляются здесь по мере прохождения. Все вместе они складываются в <a href="herocard.html#map" style="color:#f0c870">Карту героя</a>.</p><div id="hmBox">'+h+'</div>'}
if(!h)h='<p class="muted">Здесь соберутся результаты всех тестов.</p>'}
c.innerHTML=h;if(cur==='book'&&window.GDiaryBook){GDiaryBook.render(c);window.scrollTo(0,0)}var ad=document.getElementById('ad');if(ad)ad.onclick=function(){var v=document.getElementById('tx').value.trim();if(!v)return;var i=gIdx&&document.referrer?'':'';P.diary[cur].push({x:v,d:Date.now(),at:sessionStorage.getItem('alch_v5_gLastStep')||''});save();render()};
