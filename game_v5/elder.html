<title>Старец</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#f4ecdf}
.sc{position:fixed;left:0;right:0;top:0;bottom:calc(78px + env(safe-area-inset-bottom));overflow:hidden;animation:in 2s ease both}
@keyframes in{from{opacity:0;filter:brightness(3)}to{opacity:1;filter:none}}
.sc video,.sc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:40% 30%}
.sc:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 58%,rgba(0,0,0,.92))}
.tx{position:absolute;z-index:2;left:22px;right:22px;bottom:clamp(170px,25vh,210px);text-align:center}
.tx p{margin:0 0 .35em;font:600 clamp(24px,3.8vh,32px)/1.18 'Cormorant Garamond',serif;color:#fbe6b4;text-shadow:0 2px 10px #000;opacity:0;transform:translateY(10px);transition:opacity 1.2s,transform 1.2s;text-wrap:balance;-webkit-text-wrap:balance}
.tx p.on{opacity:1;transform:none}
button.sun-btn.next-sun{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);z-index:3;--sun-size:104px;opacity:0;pointer-events:none;transition:opacity 1s}
button.sun-btn.next-sun.on{opacity:1;pointer-events:auto}
@media (max-height:700px){button.sun-btn.next-sun{--sun-size:92px;bottom:54px}}
.snd{position:absolute;z-index:3;right:16px;bottom:clamp(30px,5vh,48px);width:46px;height:46px;border-radius:50%;border:2px solid #d9b46a;background:rgba(20,12,6,.65);color:#cbb68e;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;transition:.3s}
.snd.on{background:radial-gradient(#fff1c8,#d9a54e);color:#2a1606;box-shadow:0 0 16px rgba(255,205,120,.8)}
.snd svg{width:24px;height:24px}
.ztm{position:fixed;inset:0;z-index:65;background:#000;opacity:0;pointer-events:none;transition:opacity 1.6s}.ztm.on{opacity:1}
</style></head><body data-page="elder">
<div class="sc">
<video id="v" src="media/elder.mp4" poster="img/elder.jpg" autoplay muted playsinline></video>
<button class="snd" id="snd" type="button" aria-label="Озвучка" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="sw" d="M17 9l4 6M21 9l-4 6"/></svg></button>
<div class="tx" id="tx"><p>Вот ваш&nbsp;мир.</p><p>По праву рождения,<br>которое дали вам<br>высшие&nbsp;силы,</p><p>и все здесь для&nbsp;вас.</p></div>
<button type="button" class="sun-btn next-sun" id="nx" aria-label="Далее">
  <span class="sun-btn__halo" aria-hidden="true"></span>
  <span class="sun-btn__corona" aria-hidden="true"></span>
  <span class="sun-btn__core"><span class="sun-btn__tex"></span><span class="sun-btn__plasma"></span></span>
  <span class="sun-btn__label" aria-hidden="true"><svg viewBox="0 0 24 24" width="40%" height="40%"><path d="M5.2 16c-.8 0-1.3-.9-.8-1.6l6.8-10.2c.4-.6 1.2-.6 1.6 0l6.8 10.2c.5.7 0 1.6-.8 1.6z" transform="rotate(90 12 13)" fill="#e8590c"/></svg></span>
  <span class="sun-btn__cap">ДАЛЕЕ</span>
</button>
</div>
<div class="ztm" id="ztm"></div>
<audio id="au" src="media/voice.mp3" preload="auto"></audio>
<script src="engine.js?v=arch1"></script><script src="passport-data.js?v=1"></script><script src="passport.js?v=opening2"></script><script src="texts.js?v=mf4"></script><script src="texts_fr.js?v=mf2"></script><script src="nav.js?v=bar6"></script>
<script>
var ps=document.querySelectorAll('#tx p');ps.forEach(function(p,i){setTimeout(function(){p.classList.add('on')},1600+i*2000)});
setTimeout(function(){document.getElementById('nx').classList.add('on')},1600+ps.length*2000);
document.getElementById('nx').onclick=function(){if(window.GReview){location.href='tasks.html';return}document.getElementById('ztm').classList.add('on');setTimeout(function(){location.href=GRoute.advance()},1700)};
if(window.GReview){ps.forEach(function(p){p.classList.add('on')});var nx=document.getElementById('nx');nx.classList.add('on');var cap=nx.querySelector('.sun-btn__cap');if(cap)cap.textContent='К ЗАДАНИЯМ';nx.setAttribute('aria-label','К заданиям');}
var au=document.getElementById('au');
document.getElementById('snd').onclick=function(){var b=this,on=!b.classList.contains('on');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);document.getElementById('sw').setAttribute('d',on?'M16 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11':'M17 9l4 6M21 9l-4 6');if(on){au.currentTime=0;au.play().catch(function(){})}else au.pause()};
</script>
</body></html>
