<style>
:root{--g:#c9a46a;--g2:#f0d9a8;--line:#7a5a3a;--ink:#f4ecdf;--d:"Cormorant Garamond",serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#100e0c;color:var(--ink);font-family:Manrope,sans-serif}
.scr{position:fixed;left:0;right:0;top:0;bottom:calc(78px + env(safe-area-inset-bottom));padding:calc(10px + env(safe-area-inset-top)) 10px 10px;display:flex}

.lab{display:block;text-align:center;font:600 clamp(16px,2.26vh,19px) var(--d);letter-spacing:.1em;color:var(--g);margin:clamp(6px,1.2vh,12px) 0 4px;text-transform:uppercase}
.bar{position:relative;margin:0 14px}
.bar:before,.bar:after{content:"";position:absolute;top:50%;width:14px;height:14px;border:2px solid #9a7444;background:#1a130d;transform:translateY(-50%) rotate(45deg)}
.bar:before{left:-9px}.bar:after{right:-9px}
.bar input{width:100%;height:clamp(40px,5.6vh,48px);border:2px solid #8a6438;border-radius:6px;background:linear-gradient(#0e0a07,#1c150f);color:var(--ink);font:600 19px Manrope,sans-serif;text-align:center;outline:none;box-shadow:inset 0 0 0 1px #3a2a1a}

.pts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0;min-height:0}
.pt{border:1px solid #6b4c2c;border-radius:10px;background:linear-gradient(#2a1f16,#17110c);display:flex;align-items:center;gap:8px;padding:4px 8px;color:var(--ink);text-align:left;cursor:pointer;min-height:0}
.pt b{flex:none;width:clamp(34px,5vh,44px);height:clamp(34px,5vh,44px);border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(#f0d090,#a87430);color:#2a1606;font:700 clamp(18px,2.6vh,22px) var(--d)}

.pt span{display:block;font:700 clamp(17px,2.24vh,19px)/1.1 var(--d);color:var(--g2)}
.hint{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font:500 19px/1.4 Manrope;color:#8a7a66;padding:0 10px}
.btns{display:flex;gap:8px}
.b{flex:1;height:clamp(42px,5.8vh,50px);border-radius:999px;font:700 19px Manrope;cursor:pointer}
.b1{border:2px solid var(--g);background:none;color:var(--g2)}
.b2{border:0;background:linear-gradient(#e9c98a,#b88a48);color:#1a0f05}
.err{color:#f0a080;text-align:center;font-size:16px;min-height:0;margin:4px 0 0}
.go{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0}
.born{width:88%;height:clamp(56px,8vh,68px);border-radius:999px;border:2px solid #f5dca0;background:radial-gradient(ellipse at 50% 30%,#fff1c8,#e2b45e 55%,#9a6a28);color:#2a1606;font:700 clamp(22px,3.2vh,27px) var(--d);letter-spacing:.04em;cursor:pointer;animation:glow 2.2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 10px 2px rgba(255,205,120,.45)}50%{box-shadow:0 0 34px 12px rgba(255,205,120,.85)}}
.flash{position:fixed;inset:0;z-index:90;pointer-events:none;background:radial-gradient(circle at 50% 60%,#fffbe8 0,#ffe7a8 25%,rgba(255,200,110,.9) 50%,rgba(255,180,80,0) 75%);opacity:0;transform:scale(.2);transition:opacity 1s ease,transform 1.3s ease}
.flash.on{opacity:1;transform:scale(3)}
.sph img{height:clamp(60px,11vh,110px)}
.sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sh{width:100%;max-height:75dvh;overflow:auto;background:linear-gradient(#2a1f16,#15100c);border-top:2px solid #9a7444;border-radius:20px 20px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom))}
.sh h3{margin:0;font:700 28px var(--d);color:var(--g2)}.sh .k{font:600 15px Manrope;letter-spacing:.1em;color:var(--g);text-transform:uppercase}
.sh p{font:19px/1.55 Manrope;color:#e8dcc6}.sh .x{float:right;background:none;border:0;color:var(--g2);font-size:28px}
.lab{color:#fffaf0!important;font-size:clamp(19px,2.3vh,19px)!important;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.6)}
.bar input{color:#fff!important;text-shadow:0 1px 2px #000}
.bar input::placeholder{color:#e8ddc8!important;opacity:.85;font-size:19px!important}
.note{color:#fffaf0!important;font-size:clamp(19px,2.3vh,19px)!important;text-shadow:0 1px 3px #000}
.hint,.err{color:#fff3d6!important;text-shadow:0 1px 3px #000}
.g,[data-g],[data-g] *{color:#fffaf0!important;text-shadow:0 1px 3px #000}
.board,.panel,.card,.wrap{filter:brightness(1.35)}
.born{filter:brightness(1.12)}
[data-g].on,[data-g].on *,[data-g].sel,[data-g].sel *{color:#2a1606!important;text-shadow:none}
.board{display:flex!important;flex-direction:column!important;justify-content:space-between!important}
.board>h1,.board>.orn{flex:none}
.grp,.gen,.note{flex:none;margin-top:0!important;margin-bottom:0!important}
.go{flex:none!important;margin-bottom:clamp(6px,2vh,22px)}
.lab{font-family:Manrope,sans-serif!important;font-weight:700!important;letter-spacing:.04em!important;text-transform:none!important;font-size:clamp(19px,2.4vh,20px)!important;margin-bottom:8px!important}
.lab small{display:block;font-weight:500;font-size:.78em;color:#efe6d4;letter-spacing:.02em;margin-top:2px}
.note,.hint,.err{font-family:Manrope,sans-serif!important;font-style:normal!important;font-size:clamp(19px,2.24vh,19px)!important}
.gen{gap:10px!important}.flr{flex:none;filter:drop-shadow(0 0 4px rgba(255,200,110,.5))}
.born{letter-spacing:.08em!important}

/* Keyboard mode: board becomes a scrollable panel sized to the visual viewport. */
body.kb .gnav,body.kb .gtop,body.kb .gpt,body.kb .garr{display:none!important}
body.kb .scr{bottom:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-top:8px}
body.kb .board{flex:none;min-height:0;justify-content:flex-start!important;gap:clamp(8px,1.6vh,14px);padding-bottom:16px}
body.kb .go{margin-bottom:0}
body.kb .scr:after{content:"";display:block;flex:none;height:var(--kbpad,24px)}
body.kb .scr{flex-direction:column}
</style></head><body data-page="form">
<div class="scr"><div class="board">
<h1 style="margin-top:clamp(10px,2.4vh,26px)">ИНИЦИАЦИЯ АЛХИМИКА</h1><div class="orn"></div>
<div class="grp"><label class="lab" for="nm">Введите ваше имя<small>или как к вам обращаться</small></label>
<div class="bar"><input id="nm" autocomplete="name" placeholder="Имя"></div></div>
<div class="grp"><label class="lab" for="bd">Дата рождения</label>
<div class="bar"><input id="bd" inputmode="numeric" placeholder="ДД.ММ.ГГГГ" maxlength="10"></div></div>
<div class="gen"><span class="sym">♂</span><button class="md" data-g="m" type="button">М</button><svg class="flr" viewBox="0 0 90 30" width="78" height="26" aria-hidden="true"><g fill="none" stroke="#e0b866" stroke-width="1.4" stroke-linecap="round"><path d="M4 15h22M64 15h22"/><path d="M26 15c4-8 12-8 14-2-3 4-9 3-9-1M64 15c-4-8-12-8-14-2 3 4 9 3 9-1"/><path d="M26 15c4 8 12 8 14 2M64 15c-4 8-12 8-14 2"/></g><path d="M45 8l5 7-5 7-5-7z" fill="#f0cf86"/></svg><button class="md" data-g="f" type="button">Ж</button><span class="sym">♀</span></div>
<p class="note">Ваши данные — это координаты вашего старта в Мире Алхимии.</p>

<div class="go"><button class="born" type="button" id="next">РОЖДЕНИЕ ГЕРОЯ</button><p class="err" id="er"></p></div></div></div>
<div class="flash" id="flash"></div>
<div class="sheet" id="sheet"><div class="sh" id="shc"></div></div>
<script src="arcana.js?v=8"></script>
<script src="engine.js?v=p1"></script><script src="passport-data.js?v=1"></script><script src="passport.js?v=opening2"></script><script src="texts.js?v=mf4"></script><script src="texts_fr.js?v=mf2"></script><script src="nav.js?v=r3f19"></script>
<script>
var P={};try{P=JSON.parse(localStorage.getItem('alch_v5_profile'))||{}}catch(e){}
var nm=document.getElementById('nm'),bd=document.getElementById('bd'),er=document.getElementById('er');
nm.value=P.name||'';bd.value=P.birth||'';
// Inputs are a draft. Only the original birth button saves personal data.
document.querySelectorAll('.md').forEach(function(b){if(P.gender==b.dataset.g)b.classList.add('on');b.onclick=function(){document.querySelectorAll('.md').forEach(function(x){x.classList.remove('on')});b.classList.add('on');P.gender=b.dataset.g}});
function parse(v){return GPassport.parse(v)}
bd.onfocus=bd.onclick=function(){bd.select()};
nm.onfocus=nm.onclick=function(){nm.select()};
bd.oninput=function(){var v=bd.value.replace(/\D/g,'').slice(0,8),o=v.slice(0,2);if(v.length>2)o+='.'+v.slice(2,4);if(v.length>4)o+='.'+v.slice(4);bd.value=o};
var sheet=document.getElementById('sheet');sheet.onclick=function(e){if(e.target==sheet)sheet.classList.remove('on')};
if(window.GOpening)er.textContent='Ваш путь сохранен. Карта вернет к нему.';
document.getElementById('next').onclick=function(){
 P.name=nm.value.trim();P.birth=bd.value;var m=!P.name?'Напишите, как к вам обращаться.':!parse(P.birth)?'Проверьте дату рождения.':!P.gender?'Выберите: М или Ж.':'';er.textContent=m;if(m)return;
 var layers=GPassport.calculate(P.birth);P.points=[layers.positions.A,layers.positions.C,layers.positions.E,layers.positions.G];
 if(window.GOpening)GOpening.saveIdentity(P);
 var fresh=GPassport.load();['name','birth','gender','points'].forEach(function(k){fresh[k]=P[k]});GPassport.ensure(fresh);GPro.save(fresh);
 if(window.GRoute)GRoute.complete('form.html');document.getElementById('flash').classList.add('on');setTimeout(function(){location.href=window.GOpening?GOpening.url('elder.html'):'elder.html'},1300);
};
</script>
<script>
/* iOS/Android keyboard: keep the focused field, the М/Ж row and the caption above the keyboard. */
(function(){
var vv=window.visualViewport,scr=document.querySelector('.scr'),body=document.body,on=0,raf=0;var base=window.innerHeight;
function kbH(){return vv?Math.max(0,window.innerHeight-vv.height-vv.offsetTop):0}
function focusedInput(){var a=document.activeElement;return a&&(a.id==='nm'||a.id==='bd')?a:null}
function place(){raf=0;if(!focusedInput())base=Math.max(base,window.innerHeight);var f=focusedInput(),h=kbH(),vh=vv?vv.height:window.innerHeight,open=!!f&&(h>80||vh<base*.8);
 if(open!==!!on){on=open;body.classList.toggle('kb',open);if(!open){scr.style.top=scr.style.height='';scr.scrollTop=0;window.scrollTo(0,0)}}
 if(!open)return;
 var top=vv?vv.offsetTop:0,ht=vv?vv.height:window.innerHeight;
 scr.style.top=top+'px';scr.style.height=ht+'px';
 // extra room so the last caption never hides under the keyboard toolbar / address pill
 scr.style.setProperty('--kbpad','56px');
 var gen=document.querySelector('.gen'),note=document.querySelector('.note');
 var sr=scr.getBoundingClientRect(),fr=f.getBoundingClientRect(),nr=(note||gen).getBoundingClientRect();
 var want=scr.scrollTop+(nr.bottom-sr.bottom)+16;                       // caption bottom at the view bottom
 var maxUp=scr.scrollTop+(fr.top-sr.top)-12;                            // but never push the field off the top
 var nt=Math.max(0,Math.min(want,maxUp));
 if(Math.abs(nt-scr.scrollTop)>2)scr.scrollTop=nt;
}
function q(){if(!raf)raf=requestAnimationFrame(place)}
if(vv){vv.addEventListener('resize',q);vv.addEventListener('scroll',q)}
window.addEventListener('resize',q);
document.addEventListener('focusin',function(){q();setTimeout(q,120);setTimeout(q,350);setTimeout(q,700)});
document.addEventListener('focusout',function(){setTimeout(q,60)});
window.addEventListener('scroll',function(){if(on&&window.scrollY)window.scrollTo(0,0)});
})();
</script>
