var C=[
{k:'s',img:'card_s.jpg',n:'Тропа молний',p:'Эта дорога полна движения и неожиданных поворотов. Здесь возможности появляются внезапно, а перемены могут открыть путь туда, куда еще недавно невозможно было попасть. Главное сокровище этой тропы — способность не упускать момент.',m:'Не всякая молния освещает дорогу надолго. Иногда события развиваются быстрее, чем удается рассмотреть все препятствия. Придется учиться различать возможности и ловушки стремительного пути.'},
{k:'n',img:'card_n.jpg',n:'Туманная долина',p:'Эта дорога открывается постепенно. Здесь важно замечать едва различимые знаки, прислушиваться к происходящему и не торопить события. Туман скрывает лишнее, оставляя возможность увидеть то, что обычно ускользает от взгляда.',m:'Не всегда можно сразу понять, куда ведет тропа. Иногда приходится долго идти в неизвестности, прежде чем открывается нужное направление. Главное испытание — не потерять путь, пока ищешь его очертания.'},
{k:'str',img:'card_str.jpg',n:'Горный перевал',p:'Эта дорога ведет вверх, туда, откуда открывается широкий обзор. С высоты становятся заметны связи между событиями, скрытые маршруты и возможности, которые невозможно увидеть снизу. Здесь можно проложить собственный путь, не повторяя чужих маршрутов.',m:'Подъем требует усилий. Не на каждом участке встретятся указатели и проводники. Иногда придется самостоятельно искать проходы, принимать решения и нести ответственность за выбранное направление.'},
{k:'z',img:'card_z.jpg',n:'Река попутчиков',p:'Эта дорога проходит по течению большой реки. На ее берегах встречаются проводники, союзники и случайные попутчики. Здесь одни возможности рождаются из встреч, другие — из общего движения. Иногда именно тот, кто оказывается рядом, помогает увидеть новый путь.',m:'Течение меняется, а вместе с ним могут меняться и направления движения. Не каждый попутчик знает, куда стремится река. Важно не потерять собственный ориентир среди чужих маршрутов.'},
{k:'f',img:'wheel.webp',n:'Пусть выберет судьба',p:'Перед тобой все дороги. Ни одна еще не закрыта, и каждая может привести к неожиданным открытиям. Иногда случайная встреча или неожиданный поворот становятся началом самого важного путешествия. Позволь миру сделать первый ход.',m:GG('Когда направление выбирает случай, невозможно заранее знать, куда он приведет. Придется принять неизвестность и встретиться с дорогой, которую ты сам не выбирал.','Когда направление выбирает случай, невозможно заранее знать, куда он приведет. Придется принять неизвестность и встретиться с дорогой, которую ты сама не выбирала.')}];
