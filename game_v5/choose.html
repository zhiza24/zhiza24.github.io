{k:'s',img:'card_s.jpg',n:'Тропа молний',p:'Эта дорога полна движения и неожиданных поворотов. Здесь возможности появляются внезапно, а перемены могут открыть путь туда, куда еще недавно невозможно было попасть. Главное сокровище этой тропы — способность не упускать момент.',m:'Не всякая молния освещает дорогу надолго. Иногда события развиваются быстрее, чем удается рассмотреть все препятствия. Придется учиться различать возможности и ловушки стремительного пути.'},
