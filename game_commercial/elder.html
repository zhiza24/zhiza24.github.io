<!doctype html><html lang="ru"><head><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><script src="theme.js?v=13"></script><script src="sound.js?v=4"></script><script src="flow.js?v=im1"></script><script src="opening.js?v=opening2"></script><script src="route.js?v=im1"></script><script src="profile-layer.js?v=art1"></script><script src="route-gate.js?v=im1"></script><script src="gender.js?v=1"></script><meta http-equiv="Cache-Control" content="no-cache"><script src="upd.js?v=1794512684"></script><meta http-equiv="Cache-Control" content="no-cache">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Старец</title>

<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#000">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="nav.css?v=map1">

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#f4ecdf}
.sc{position:fixed;left:0;right:0;top:0;bottom:calc(78px + env(safe-area-inset-bottom));overflow:hidden;animation:in 2s ease both}
@keyframes in{from{opacity:0;filter:brightness(3)}to{opacity:1;filter:none}}
.sc video,.sc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:40% 30%}
.sc:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 58%,rgba(0,0,0,.92))}
.tx{position:absolute;z-index:2;left:22px;right:22px;bottom:clamp(170px,25vh,210px);text-align:center}
.tx p{margin:0 0 .35em;font:600 clamp(24px,3.8vh,32px)/1.18 'Cormorant Garamond',serif;color:#fbe6b4;text-shadow:0 2px 10px #000;opacity:0;transform:translateY(10px);transition:opacity 1.2s,transform 1.2s;text-wrap:balance;-webkit-text-wrap:balance}
.tx p.on{opacity:1;transform:none}
button.sun-btn.next-sun{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);z-index:3;--sun-size:104px;opacity:0;pointer-events:none;transition:opacity 1s}
button.sun-btn.next-sun.on{opacity:1;pointer-events:auto}
@media (max-height:700px){button.sun-btn.next-sun{--sun-size:92px;bottom:54px}}
.snd{position:absolute;z-index:3;right:16px;bottom:clamp(30px,5vh,48px);width:46px;height:46px;border-radius:50%;border:2px solid #d9b46a;background:rgba(20,12,6,.65);color:#cbb68e;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;transition:.3s}
.snd.on{background:radial-gradient(#fff1c8,#d9a54e);color:#2a1606;box-shadow:0 0 16px rgba(255,205,120,.8)}
.snd svg{width:24px;height:24px}
.hint{position:absolute;z-index:3;left:22px;right:22px;bottom:clamp(210px,32vh,260px);text-align:center;font:600 15px/1.35 Manrope,sans-serif;color:#f4e0b8;text-shadow:0 2px 8px #000;opacity:0;pointer-events:none;transition:opacity .5s}
.hint.on{opacity:.92}
.ztm{position:fixed;inset:0;z-index:65;background:#000;opacity:0;pointer-events:none;transition:opacity 1.6s}.ztm.on{opacity:1}
</style></head><body data-page="elder">
<div class="sc">
<video id="v" src="media/elder.mp4?v=2" poster="img/elder.jpg" muted playsinline preload="auto"></video>
<button class="snd" id="snd" type="button" aria-label="Озвучка" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="sw" d="M17 9l4 6M21 9l-4 6"/></svg></button>
<div class="tx" id="tx"><p>Вот ваш&nbsp;мир.</p><p>По праву рождения,<br>которое дали вам<br>высшие&nbsp;силы,</p><p>и все здесь для&nbsp;вас.</p></div>
<div class="hint" id="hint">Коснись экрана, чтобы слушать</div>
<button type="button" class="sun-btn next-sun" id="nx" aria-label="Далее">
  <span class="sun-btn__halo" aria-hidden="true"></span><span class="sun-btn__rays" aria-hidden="true"></span><span class="sun-btn__rays sun-btn__rays--fine" aria-hidden="true"></span><span class="sun-btn__corona" aria-hidden="true"></span><span class="sun-btn__core" aria-hidden="true"><span class="sun-btn__tex"></span><span class="sun-btn__plasma"></span><span class="sun-btn__hot"></span></span><span class="sun-btn__sparks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="sun-btn__burst" aria-hidden="true"></span>
  <span class="sun-btn__label" aria-hidden="true"><svg viewBox="0 0 24 24" width="40%" height="40%"><path d="M5.2 16c-.8 0-1.3-.9-.8-1.6l6.8-10.2c.4-.6 1.2-.6 1.6 0l6.8 10.2c.5.7 0 1.6-.8 1.6z" transform="rotate(90 12 13)" fill="#7a2a08"/></svg></span>
  <span class="sun-btn__cap">ДАЛЕЕ</span>
</button>
</div>
<div class="ztm" id="ztm"></div>
<audio id="au" src="media/voice.mp3" preload="auto"></audio>
<script src="engine.js?v=arch1"></script><script src="passport-data.js?v=1"></script><script src="passport.js?v=opening2"></script><script src="texts.js?v=map1"></script><script src="texts_fr.js?v=mf2"></script><script src="nav.js?v=r75"></script>
<script>
var ps=document.querySelectorAll('#tx p');
var au=document.getElementById('au');
var v=document.getElementById('v');
var snd=document.getElementById('snd');
var nx=document.getElementById('nx');
var hint=document.getElementById('hint');
var started=false,ticking=false,hintT;
function soundOn(){return !window.GSound||GSound.isOn()}
function paintSnd(on){
 snd.classList.toggle('on',!!on);
 snd.setAttribute('aria-pressed',on?'true':'false');
 document.getElementById('sw').setAttribute('d',on?'M16 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11':'M17 9l4 6M21 9l-4 6');
}
function hideHint(){clearTimeout(hintT);if(hint)hint.classList.remove('on')}
function showHint(){if(hint&&!started)hint.classList.add('on')}
function syncText(){
 var t=v.currentTime||0;
 ps.forEach(function(p,i){if(t>=1.6+i*2)p.classList.add('on');else p.classList.remove('on')});
 if(t>=1.6+ps.length*2)nx.classList.add('on');
 if(ticking&&!v.paused&&!v.ended)requestAnimationFrame(syncText);
 else ticking=false;
}
var t0=0,lastT=-1,lastMove=0,fallback=false;
function wd(){if(window.GReview)return;if(!started){setTimeout(wd,400);return}var now=Date.now(),t=v.currentTime||0;if(t!==lastT){lastT=t;lastMove=now}
 if(!fallback&&now-lastMove>2500)fallback=true;
 if(fallback){var e=(now-t0)/1000;ps.forEach(function(p,i){if(e>=1.6+i*2)p.classList.add('on')});if(e>=1.6+ps.length*2)nx.classList.add('on')}
 if(!nx.classList.contains('on'))setTimeout(wd,400)}
setTimeout(function(){nx.classList.add('on')},20000);
function startTick(){if(ticking)return;ticking=true;requestAnimationFrame(syncText)}
function begin(){
 if(window.GReview)return true;
 started=true;hideHint();
 try{if(window.GSound&&GSound.unlock)GSound.unlock()}catch(e){}
 try{v.currentTime=0}catch(e){}
 try{au.pause();au.currentTime=0}catch(e){}
 ps.forEach(function(p){p.classList.remove('on')});
 nx.classList.remove('on');
 var vp=v.play();if(vp&&vp.catch)vp.catch(function(){});
 startTick();
 t0=lastMove=Date.now();lastT=-1;fallback=false;setTimeout(wd,400);
 if(!soundOn()){paintSnd(false);return true}
 paintSnd(true);
 var p=au.play();
 if(p&&p.catch){
  p.catch(function(){
   paintSnd(false);
   started=false;
   try{v.pause();v.currentTime=0}catch(e){}
   showHint();
  });
 }
 return true;
}
document.getElementById('nx').onclick=function(){if(window.GReview){location.href='tasks.html';return}try{au.pause();v.pause()}catch(e){}document.getElementById('ztm').classList.add('on');setTimeout(function(){location.href=GRoute.advance()},1700)};
if(window.GReview){
 ps.forEach(function(p){p.classList.add('on')});
 nx.classList.add('on');
 var cap=nx.querySelector('.sun-btn__cap');if(cap)cap.textContent='К ЗАДАНИЯМ';
 nx.setAttribute('aria-label','К заданиям');
}else{
 try{au.preload='auto';au.load()}catch(e){}
 function onFirst(){if(!started)begin()}
 document.addEventListener('pointerdown',onFirst,true);
 document.addEventListener('touchstart',onFirst,{capture:true,passive:true});
 document.addEventListener('keydown',onFirst,true);
 begin();
 hintT=setTimeout(function(){if(soundOn()&&au.paused)showHint()},400);
}
snd.addEventListener('click',function(e){
 e.preventDefault();e.stopPropagation();
 if(!soundOn()){paintSnd(false);return}
 if(!started||au.paused){started=false;begin()}
 else{au.pause();paintSnd(false)}
});
au.addEventListener('ended',function(){paintSnd(false)});
</script>
</body></html>
