<html lang="ru">
<head><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="upd.js?v=1794512684"></script><title>Колесо самопредательства</title>
<link rel="icon" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="g.css?v=1f19"><link rel="stylesheet" href="nav.css?v=map1">
<style>
.bt{max-width:460px;margin:0 auto;padding:calc(68px + env(safe-area-inset-top)) 18px 128px;color:#f4ecdf;font:500 17px/1.5 Manrope,sans-serif}
.bt h1{font:700 28px/1.15 'Cormorant Garamond',serif;color:#f0c870;margin:0 0 10px;text-align:center}
.bw-intro-hero{position:relative;margin:0 auto 14px;border-radius:18px;overflow:hidden;border:1px solid #9e783a;background:#0e0905;box-shadow:0 16px 38px rgba(0,0,0,.58);aspect-ratio:9/13;max-height:420px}
.bw-intro-hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 46%}
.bw-intro-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(14,9,5,.86) 100%);pointer-events:none}
.bw-intro-cap{position:absolute;left:14px;right:14px;bottom:12px;z-index:2;text-align:center;font:600 12px/1.4 Manrope,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#f0c870}
.bw-elder{border:1px solid #9e783a;border-radius:18px;padding:18px 16px;background:linear-gradient(145deg,rgba(48,34,19,.95),rgba(20,14,8,.96));box-shadow:inset 0 0 28px rgba(201,164,106,.08);margin-bottom:14px}.bw-elder-tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-align:center;color:#c9a46a;margin-bottom:8px}.bw-elder p{font-size:15px;line-height:1.6;margin:10px 0}.bw-elder .lead{font-size:16px}
.bt h2{font:700 25px/1.2 'Cormorant Garamond',serif;color:#f0c870;margin:22px 0 8px}
.bt h3{font:700 19px/1.3 Manrope,sans-serif;color:#f0c870;margin:15px 0 6px}
.bt p{line-height:1.55}.bt .lead{margin:0 0 14px;color:#f4ecdf;text-align:center}
.bt .mute{color:#c9a46a;font-size:14px;text-align:center}
.bt .go{display:block;width:100%;box-sizing:border-box;margin:16px 0 0;padding:15px 18px;border:0;border-radius:999px;background:linear-gradient(#ffe9a8,#e0a940 55%,#a8692a);color:#2a1606;font:800 17px Manrope,sans-serif}
.bt .quiet{display:block;margin:14px auto 0;background:none;border:0;color:#c9a46a;text-decoration:underline;text-underline-offset:3px;font:600 14px Manrope,sans-serif;text-align:center;width:100%}
.bw-card{touch-action:pan-y}.bw-choice{cursor:pointer}.bw-choice:active{border-color:#f0c870;background:rgba(240,200,112,.12)}
.bw-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.bw-actions button{border:1px solid #9e783a;background:#21170e;color:#f4ecdf;border-radius:13px;padding:12px;font:600 15px/1.45 Manrope,sans-serif;min-height:58px}
.bw-actions button:first-child{border-color:#8a7a72}.bw-actions button:last-child{border-color:#d9a441}
.bw-mid{display:block;margin:10px auto 0;background:none;border:0;color:#c9a46a;font:500 14px Manrope;padding:8px}
.bw-progress{height:6px;background:#3a2a18;border-radius:8px;overflow:hidden;margin:8px 0 12px}.bw-progress i{display:block;height:100%;background:#e0a940}
.bw-sector{margin:20px 0}.bw-sector article{padding:12px 0;border-top:1px solid #6a4e28}
.bw-sector h3{font-size:18px;color:#f0c870;margin:12px 0 5px}
.bw-sector p{font-size:16px;line-height:1.55;margin:5px 0}
.bw-why{color:#c9a46a}.bw-result-intro{font-size:16px;line-height:1.6}
.bw-reveal-status{text-align:center;color:#f0c870;font:600 14px/1.5 Manrope,sans-serif;margin:10px 0 4px}
.bw-skip-anim{display:inline-block;margin-left:8px;background:none;border:1px solid rgba(201,164,106,.5);border-radius:999px;color:#c9a46a;font:600 12px Manrope,sans-serif;padding:3px 10px;cursor:pointer}
.bw-reveal-body{opacity:0;max-height:0;overflow:hidden;transform:translateY(10px);transition:opacity .7s ease,transform .7s ease}
.bw-reveal-body.is-shown{opacity:1;max-height:none;overflow:visible;transform:none}
</style>
</head>
<body data-page="task"><main class="bt" id="bt"></main>
<script src="engine.js?v=arch1"></script><script src="texts.js?v=map1"></script><script src="texts_fr.js?v=mf2"></script>
<script src="result-card.js?v=fx5"></script><script src="nav.js?v=r75"></script><script src="support.js?v=wish1"></script>
<script src="betraywheel.js?v=bw5"></script>
<script>
(function(){
'use strict';
var KEY='alch_v5_profile',AGAIN=!!window.GRetake,box=document.getElementById('bt');
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(P){try{localStorage.setItem(KEY,JSON.stringify(P));return true}catch(e){return false}}
function Pget(){var P=load();P.betray=P.betray||{};return P}
function seed(P){return String(P.name||'')+'|'+String(P.birth||'')+'|betray-wheel-v2'}
var P0=Pget(),old=AGAIN?P0.betray.draftEnd:P0.betray.draft,validDraft=!!(old&&old.version===3&&Array.isArray(old.order)&&old.order.length===GBW.QUESTIONS.length&&old.answers);
var order=validDraft?old.order:GBW.ordered(seed(P0)).map(function(q){return q.id});
var answers=validDraft?old.answers:{},index=validDraft&&Number.isInteger(old.i)?old.i:0;
function current(){return GBW.QUESTIONS.filter(function(q){return q.id===order[index]})[0]}
function persist(){var P=Pget();P.betray[AGAIN?'draftEnd':'draft']={version:3,i:index,order:order,answers:answers,at:Date.now()};return save(P)}
function tick(){if(window.GSound&&!GSound.isOn())return;try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;var c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=660;g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.045)}catch(e){}}
function progress(){return GBW.progress(answers)}
function wheel(labels,size,reveal){return GBW.svg(answers,{labels:!!labels,reveal:!!reveal,size:size||310})}
function intro(){
 GBW.css();var n=progress();
 box.innerHTML='<div class="bw-intro-hero"><img src="img/betray_intro.jpg?v=1" alt="Колесо самопредательства и опоры"><span class="bw-intro-cap">Тень и опора · две половины одного круга</span></div><section class="bw-elder"><div class="bw-elder-tag">Старец · исследование</div><h1>Колесо самопредательства</h1><p class="lead">'+GBW.intro()+'</p><p>— Не ищи правильный ответ. Вспоминай, как ты поступаешь в обычной жизни, особенно когда '+GG('устал','устала')+', волнуешься, чего-то ждешь от других или берешься за важное дело.</p><p>— Смотри на конкретную ситуацию, а не на то, каким человеком тебе хотелось бы быть.</p><p>— Слева на карте — привычные способы отодвигать себя, справа — твои опоры. Пока ты отвечаешь, закрашиваются только секторы. Названия откроются в финале.</p><p>— Если оба варианта тебе знакомы, так и отметь. Если ни один не подходит, пропусти ситуацию.</p></section><button class="go" id="go">'+(n?'Продолжить':'Начать')+'</button>'+(AGAIN?'':'<button class="quiet" id="skip">Пропустить</button>');
 document.getElementById('go').onclick=function(){tick();persist();draw()};
 var sk=document.getElementById('skip');if(sk)sk.onclick=function(){finish(true)};
}
function choose(value){var q=current();if(!q)return;answers[q.id]=value;index++;persist();tick();draw();window.scrollTo(0,0)}
function step(){
 var q=current(),n=progress(),html='<p class="mute">Ситуация '+(index+1)+' из '+order.length+'</p><div class="bw-progress"><i style="width:'+(n/order.length*100)+'%"></i></div>'+wheel(false,230,false)+'<p class="mute">Названия секторов пока скрыты — они откроются, когда ответишь на все ситуации.</p>';
 html+='<section class="bw-card" id="swipeCard"><p style="color:#c9a46a;font-size:14px;text-align:center">Вспомни, как обычно бывает в реальной жизни</p><h1 style="font-size:24px">'+GBW.gf(q.text)+'</h1><div class="bw-actions"><button type="button" data-v="left"><small>Свайп влево</small><br>'+GBW.gf(q.left)+'</button><button type="button" data-v="right"><small>Свайп вправо</small><br>'+GBW.gf(q.right)+'</button></div><button type="button" class="bw-mid" data-v="both">Оба варианта бывают</button><button type="button" class="bw-mid" data-v="skip">Ни один не подходит</button></section>';
 if(index>0)html+='<button type="button" class="quiet" id="back">Назад</button>';
 box.innerHTML=html;
 box.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){var x=b.getAttribute('data-v');if(x==='skip'){answers[q.id]='none';index++;persist();draw();return}choose(x)}});
 var card=document.getElementById('swipeCard'),sx=null,sy=null;
 card.addEventListener('touchstart',function(e){if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
 card.addEventListener('touchend',function(e){if(sx===null||!e.changedTouches.length)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.25)choose(dx<0?'left':'right')},{passive:true});
 var bk=document.getElementById('back');if(bk)bk.onclick=function(){index=Math.max(0,index-1);persist();draw();window.scrollTo(0,0)};
}
function legacyFields(rec){
 var sh={},sp={},map={perf:'perf',please:'please',numb:'numb',detach:'detach',over:'over',ctrl:'ctrl'},support={perf:'enough',please:'bound',numb:'alive',detach:'near',over:'care',ctrl:'trust'};
 rec.sectors.forEach(function(s){var neg=0,pos=0,den=0;s.forms.forEach(function(f){if(!f.answered)return;neg+=(f.shadow.score||0)*f.answered;pos+=(f.support.score||0)*f.answered;den+=f.answered});if(!den)return;var nv=Math.round(neg/den/100*3),pv=Math.round(pos/den/100*3);if(nv)sh[map[s.id]]=nv;if(pv)sp[support[s.id]]=pv});
 rec.sh=sh;rec.sp=sp;
}
function result(){
 var rec=GBW.result(answers);legacyFields(rec);
 var html='<p class="mute">Все ситуации пройдены</p><h1>Твоя карта способов реагирования</h1>'+wheel(true,360,true);
 html+='<p class="bw-reveal-status" id="bwRevealStatus">Проявляем надписи на обеих половинах колеса… <button type="button" class="bw-skip-anim" id="bwSkipAnim">Показать выводы</button></p>';
 html+='<div class="bw-reveal-body" id="bwRevealBody">';
 html+='<p class="bw-result-intro">Левая половина показывает способы, которыми ты можешь отодвигать себя или искать безопасность через привычную защиту. Правая — твои опоры. Обе стороны могут быть частью твоей жизни одновременно.</p>';
 html+=GBW.legend()+GBW.detailsHtml(rec,GBW.gf);
 html+='<p class="bw-result-intro">Для каждого из 12 способов учитываются две конкретные ситуации. Процент показывает долю выбранных ответов: 0%, 50% или 100%. Если ситуация пропущена, она не входит в расчет. Это не процент личности и не оценка характера.</p>';
 html+='<button class="go" id="go">'+(AGAIN?'Вернуться к итогам':'Дальше')+'</button></div>';
 box.innerHTML=html;
 var bodyEl=document.getElementById('bwRevealBody'),statusEl=document.getElementById('bwRevealStatus');
 if(window.GResultCard&&bodyEl){
  var support=[],shadow=[],evidence=[];
  (rec.sectors||[]).forEach(function(sec){(sec.forms||[]).forEach(function(f){
   if(typeof f.support.score==='number'&&f.support.score>=50)support.push(GBW.gf(f.support.title));
   if(typeof f.shadow.score==='number'&&f.shadow.score>=50)shadow.push(GBW.gf(f.shadow.title));
  })});
  GBW.QUESTIONS.forEach(function(q){var v=answers[q.id],label=v==='left'?GBW.gf(q.left):v==='right'?GBW.gf(q.right):v==='both'?'Оба способа бывают':v==='none'?'Ни один не подходит':'Нет ответа';evidence.push(GBW.gf(q.text)+' — '+label)});
  GResultCard.attachDiaryBar(bodyEl,{id:AGAIN?'betray_end':'betray_start',step:'betray.html',title:AGAIN?'Повторная карта самоподдержки и реакций':'Колесо самопредательства и опоры',passed:AGAIN?'Финал':'Точка 0',lead:'Карта показывает выбранные способы в конкретных ситуациях. Проценты — доля ответов внутри пары ситуаций, а не процент личности и не оценка характера.',strong:support.join(' · '),insight:shadow.join(' · '),insightLabel:'Где ты можешь отодвигать себя ради привычной защиты',insightMore:GBW.detailsHtml(rec,GBW.gf),answers:evidence,at:rec.completedAt||Date.now()});
 }
 var revealTimer=null;
 function showBody(){if(revealTimer){clearTimeout(revealTimer);revealTimer=null}if(statusEl)statusEl.hidden=true;if(bodyEl)bodyEl.classList.add('is-shown')}
 var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(reduced)showBody();else revealTimer=setTimeout(showBody,1850);
 var skipBtn=document.getElementById('bwSkipAnim');if(skipBtn)skipBtn.onclick=showBody;
 document.getElementById('go').onclick=function(){finish(false,rec)};
}
function finish(skipped,rec){
 tick();var P=Pget(),B=P.betray;
 if(skipped){B.skipped=Date.now();save(P);if(AGAIN){location.href='slot.html?id=compare';return}location.href=window.GRoute?GRoute.advance():'tasks.html';return}
 rec=rec||GBW.result(answers);legacyFields(rec);rec.at=Date.now();rec.v=3;
 if(AGAIN){if(B.end){(B.history=B.history||[]).push(B.end)}B.end=rec;delete B.draftEnd}
 else{if(B.start){(B.history=B.history||[]).push(B.start)}B.start=rec;B.done=Date.now();delete B.draft;B.picked=GBW.legacyPicked(rec)}
 if(window.GProfile)try{GProfile.saveResult('betrayWheel',rec,answers,{profile:P})}catch(e){}
 save(P);
 if(AGAIN){location.href='slot.html?id=compare';return}
 location.href=window.GRoute?GRoute.advance():'tasks.html';
}
function draw(){if(index>=order.length){result();return}if(index<0)index=0;if(!document.getElementById('bt').dataset.started){intro();document.getElementById('bt').dataset.started='1';return}step()}
GBW.css();draw();
})();
</script>
</main></body></html>
