R.pb_intro=function(){return '<span class="tag">Точка Б</span><span class="tag">Исследование</span><h1>От привычной схемы к точке выбора</h1><p>В этой части пути мы исследуем не «что с тобой не так», а то, как складывается повторяющаяся ситуация: что происходит, как ты реагируешь, какое правило возникает, что оно помогает сохранить и какой ценой обходится.</p><div class="pt"><b>Сначала — реальные эпизоды</b><p>Отделим наблюдаемое событие от интерпретации и проверим, действительно ли одна схема повторяется.</p></div><div class="pt"><b>Затем — возможные основания</b><p>Рассмотрим несколько объяснений, не превращая предварительные гипотезы в диагноз. Внешние обстоятельства, нехватка ресурсов и реальные ограничения тоже имеют значение.</p></div><div class="pt"><b>В конце — точка влияния</b><p>Уточним желание, выберем ориентиры и найдем изменение, которое можно проверить без давления на себя.</p></div><p class="mute">Можно отвечать «не знаю», не соглашаться с автоматической интерпретацией и оставлять вопросы открытыми. При угрозе или принуждении безопасность важнее эксперимента.</p><button class="next" id="nx">Начать исследование</button>'};
