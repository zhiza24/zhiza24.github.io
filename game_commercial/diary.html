<!doctype html><html lang="ru"><head><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><script src="theme.js?v=13"></script><script src="sound.js?v=4"></script><script src="flow.js?v=im1"></script><script src="opening.js?v=opening2"></script><script src="route.js?v=im2"></script><script src="profile-layer.js?v=art1"></script><script src="route-gate.js?v=im1"></script><script src="gender.js?v=1"></script><script src="book.js?v=fx6"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-180.png">
<title>Дневник</title><script src="upd.js?v=1794512684"></script><link rel="stylesheet" href="nav.css?v=map1"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><link rel="stylesheet" href="book.css?v=b2"><link rel="stylesheet" href="passport.css?v=fx1"><style>
*{box-sizing:border-box}body{margin:0;background:#0c0804;color:#f4ecdf;font-family:Manrope,sans-serif;font-size:18px}.wrap{max-width:560px;margin:auto;padding:calc(64px + env(safe-area-inset-top)) 14px 120px}h1{font-size:26px;color:#f0c870;margin:0 0 12px}.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;margin-bottom:14px}.tabs button{font:700 15.5px Manrope;padding:10px 4px;border-radius:12px;border:1px solid #a98954;background:#392a18;color:#fff3da;cursor:pointer}.tabs button.on{background:#e8c16c;color:#26190b}.e{background:#20170e;border:1px solid #5a4325;border-radius:14px;padding:14px;margin:10px 0;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.dt{font-size:15px;color:#bfa77f;margin-bottom:6px}.e b{color:#f0c870}textarea{width:100%;min-height:110px;font:500 18px/1.5 Manrope,sans-serif;color:#f4ecdf;background:#1a120a;border:1px solid #a98954;border-radius:14px;padding:12px;resize:vertical}.add{width:100%;margin-top:8px;min-height:48px;border:0;border-radius:12px;background:#edc879;color:#291a08;font:800 18px Manrope;cursor:pointer}.muted{color:#bfa77f}.del{float:right;background:none;border:0;color:#bfa77f;font-size:18px;cursor:pointer}
.blk-card{white-space:normal}.blk-h{font:700 22px/1.2 'Cormorant Garamond',serif;color:#f0c870;margin:0 0 6px}.blk-lead{margin:0 0 8px;color:#fff3da;font-weight:600}.blk-p{margin:0 0 8px;font-size:16px}.blk-det{margin-top:8px;border-top:1px dashed rgba(169,137,84,.35);padding-top:6px}.blk-det summary{cursor:pointer;color:#e8c16c;font-weight:700;font-size:15px}.blk-det ul{margin:6px 0 0;padding-left:18px;font-size:15px}.blk-notes{margin-top:10px;padding-top:8px;border-top:1px solid rgba(169,137,84,.28)}.blk-note-item{font-size:15px;margin:4px 0;color:#e6d6bb}.blk-note-tag{color:#e8c16c;font-weight:700}
</style></head><body data-page="diary"><main class="wrap"><h1>Дневник</h1><div class="tabs" id="tb"></div><section id="c"></section></main><script src="engine.js?v=ty1"></script><script src="passport-data.js?v=1"></script><script src="passport.js?v=opening2"></script><script src="nature.js?v=full1"></script><script src="texts.js?v=map1"></script><script src="texts_fr.js?v=mf2"></script><script src="nav.js?v=r75"></script><script src="result-card.js?v=fx5"></script><script src="diary-book.js?v=fx6"></script><script src="heromap.js?v=map2"></script><script>
var P={};try{P=JSON.parse(localStorage.getItem('alch_v5_profile'))||{}}catch(e){}
P.diary=P.diary||{};P.diary.q=P.diary.q||[];P.diary.ins=P.diary.ins||[];P.diary.blocks=P.diary.blocks||[];
function save(){if(window.GPro)GPro.save(P);else if(window.GProfile)GProfile.save(P);else localStorage.setItem('alch_v5_profile',JSON.stringify(P))}
var T=[['tests','Итоги'],['ins','Инсайты'],['q','Вопросы'],['path','Путь'],['cycles','Циклы'],['book','Книга Алхимика']];
if(window.GRoute&&GRoute.state(P).finished)T.splice(5,0,['nature','Расшифровка']);
var cur=new URLSearchParams(location.search).get('tab')||'tests';
function esc(x){return String(x==null?'':x).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function dt(t){var d=new Date(t);return isNaN(d)?(t||''):d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function card(head,body){return '<div class="e">'+(head?'<div class="dt">'+head+'</div>':'')+body+'</div>'}

function linkedNotes(blockId,title){
 var out=[];
 (P.diary.ins||[]).forEach(function(n){if((blockId&&n.blockId===blockId)||(title&&n.at===title))out.push({k:'Инсайт',x:n.x,d:n.d})});
 (P.diary.q||[]).forEach(function(n){if((blockId&&n.blockId===blockId)||(title&&n.at===title))out.push({k:'Вопрос',x:n.x,d:n.d})});
 if(!out.length)return '';
 return '<div class="blk-notes">'+out.map(function(o){return '<div class="blk-note-item"><span class="blk-note-tag">'+o.k+':</span> '+esc(o.x)+'</div>'}).join('')+'</div>';
}

function render(){
 document.getElementById('tb').innerHTML=T.map(function(t){return '<button data-t="'+t[0]+'" class="'+(t[0]===cur?'on':'')+'">'+t[1]+'</button>'}).join('');
 var c=document.getElementById('c'),h='',wrap=document.querySelector('.wrap');
 if(wrap)wrap.classList.toggle('dbk-on',cur==='book');
 if(cur!=='book'&&window.GBook)GBook.close();

 if(cur==='ins'||cur==='q'){
  var L=P.diary[cur];
  h='<textarea id="tx" placeholder="'+(cur==='ins'?'Запиши свою мысль или открытие':'Запиши вопрос, который хочется разобрать')+'"></textarea><button class="add" id="ad">Записать</button>';
  if(!L.length)h+='<p class="muted">Пока записей нет.</p>';
  L.slice().reverse().forEach(function(e,j){h+='<div class="e"><button class="del" data-d="'+(L.length-1-j)+'" aria-label="Удалить">×</button><div class="dt">'+dt(e.d)+(e.at?' · '+esc(e.at):'')+'</div>'+esc(e.x)+'</div>'});
 }
 else if(cur==='cycles'){
  var cycles=P.cycleHistory||[];
  if(!cycles.length)h='<p class="muted">Здесь появятся завершенные циклы. Новый цикл не стирает прежний.</p>';
  cycles.slice().reverse().forEach(function(cy){
   var cp=cy.profile||{},rc=cp.reactor||{};
   h+=card('Круг '+cy.cycle+' · '+dt(cy.closedAt),
    '<b>'+esc((window.GPAT&&GPAT[cy.lead]||{}).n||cy.lead)+'</b><br>Засчитано дней: '+esc(rc.day||0)+' / 21<br>Исходное колесо: '+esc((cp.wheel||[]).join(', '))+'<br>Повторное колесо: '+esc(((cp.retest||{}).wheel||[]).join(', ')));
  });
 }
 else if(cur==='book'){h=''}
 else if(cur==='nature'){
  var nr=window.GNature&&P.birth?GNature.calc(P.birth):null;
  h=nr?'<p class="muted" style="white-space:normal">Подробное описание твоей природы. Здесь собраны особенности основного профиля, дополнительные грани и способы принятия решений. К этому разделу можно возвращаться по мере прохождения пути.</p><div class="e blk-card">'+GNature.fullHtml(nr,P.gender==='f')+'</div>':'<p class="muted">Расшифровка появится после заполнения даты рождения.</p>';
 }
 else if(cur==='path'){
  var lg=(P.log||[]).slice().reverse();
  if(!lg.length)h='<p class="muted">Здесь сами появятся шаги пути и ключевые выборы.</p>';
  lg.forEach(function(e){h+=card(dt(e.d||e.t),e.x?esc(e.x):'<b>'+esc(e.t)+'</b><br>'+esc(e.r))});
 }
 else {
  /* Вкладка «Итоги»: автосохраненные расшифровки всех пройденных блоков по порядку (без артефактов) + привязанные инсайты/вопросы */
  var blocks=(P.diary.blocks||[]).map(function(b,i){return {b:b,i:i}});
  function routeKey(s){return String(s||'').replace(/([?&])(preview|retake)=1/g,'').replace(/[?&]$/,'')}
  function routeOrder(b){
   var key=routeKey(b&&b.step);
   if(!key||!window.GFLOW)return 99999;
   for(var i=0;i<GFLOW.length;i++){if(routeKey(GFLOW[i].u)===key)return i}
   return 99999;
  }
  /* Итоги показываются в утвержденном порядке маршрута, а не в порядке случайных повторных заходов. */
  blocks.sort(function(a,b){
   var x=routeOrder(a.b),y=routeOrder(b.b);
   return x-y||(Number(a.b.at)||0)-(Number(b.b.at)||0)||a.i-b.i;
  });
  blocks=blocks.map(function(x){return x.b});
  var seenSteps={};
  blocks.forEach(function(b){
   if(b.step)seenSteps[b.step]=1;
   var bHtml='<div class="e blk-card">';
   if(b.passed||b.at)bHtml+='<div class="dt">'+esc(b.passed||'')+(b.at?' · '+dt(b.at):'')+'</div>';
   if(b.title)bHtml+='<div class="blk-h">'+esc(b.title)+'</div>';
   if(b.lead)bHtml+='<p class="blk-lead">'+esc(b.lead)+'</p>';
   if(b.strong)bHtml+='<p class="blk-p"><b>Сильные стороны:</b> '+esc(b.strong)+'</p>';
   if(b.insight)bHtml+='<p class="blk-p"><b>На что обратить внимание:</b> '+esc(b.insight)+'</p>';
   if(b.strongMore||b.insightMore){
    bHtml+='<details class="blk-det"><summary>Полная расшифровка</summary><div style="margin-top:6px">'+(window.GResultCard&&GResultCard.safeDiaryHtml?GResultCard.safeDiaryHtml(b.strongMore||'')+(GResultCard.safeDiaryHtml(b.insightMore||'')):(b.strongMore||'')+(b.insightMore||''))+'</div></details>';
   }
   if(Array.isArray(b.history)&&b.history.length){
    bHtml+='<details class="blk-det"><summary>Предыдущие прохождения ('+b.history.length+')</summary>'+b.history.slice().reverse().map(function(old){return '<div class="blk-det"><div class="dt">'+esc(old.passed||'')+(old.at?' · '+dt(old.at):'')+'</div>'+(old.title?'<b>'+esc(old.title)+'</b>':'')+(old.lead?'<p class="blk-p">'+esc(old.lead)+'</p>':'')+(old.strong?'<p class="blk-p"><b>Сильные стороны:</b> '+esc(old.strong)+'</p>':'')+(old.insight?'<p class="blk-p"><b>На что обратить внимание:</b> '+esc(old.insight)+'</p>':'')+((old.strongMore||old.insightMore)?'<details class="blk-det"><summary>Расшифровка прежнего результата</summary><div>'+ (window.GResultCard&&GResultCard.safeDiaryHtml?GResultCard.safeDiaryHtml(old.strongMore||'')+GResultCard.safeDiaryHtml(old.insightMore||''):(old.strongMore||'')+(old.insightMore||''))+'</div></details>':'')+(Array.isArray(old.answers)&&old.answers.length?'<details class="blk-det"><summary>Свидетельства прежних ответов ('+old.answers.length+')</summary><ul>'+old.answers.map(function(a){return '<li>'+esc(a)+'</li>'}).join('')+'</ul></details>':'')+'</div>'}).join('')+'</details>';
   }
   bHtml+=linkedNotes(b.id,b.title);
   bHtml+='</div>';
   h+=bHtml;
  });

  if(window.GHM&&!window._hmR){window._hmR=1;GHM.ready(function(){render()});if(!h)h='<p class="muted">Загружаю итоги…</p>'}
  else if(window.GHM){
   GHM.css();
   var D=GHM.done(P);
   D.forEach(function(x){
    if(seenSteps[x.step])return;
    h+='<div class="e hm-it blk-card"><div class="dt">'+esc(x.name)+'</div>'+x.html+linkedNotes(x.key,x.name)+
     (x.key==='mirrors'&&(P.mirrors||{}).history&&P.mirrors.history.length?'<p><a style="color:#f0c870" href="slot.html?id=mirrors&amp;review='+encodeURIComponent(P.mirrors.history[P.mirrors.history.length-1].id)+'">Посмотреть оба зеркала</a></p>':'')+
     '</div>';
   });
  }
  if(h)h='<p class="muted" style="white-space:normal">Расшифровки всех пройденных блоков сохраняются здесь автоматически по порядку пути. Артефакты хранятся в разделе <a href="herocard.html" style="color:#f0c870">Герой</a>.</p><div id="hmBox">'+h+'</div>';
  else h='<p class="muted">Здесь автоматически соберутся расшифровки всех пройденных блоков, твои ключевые ответы и записи к ним.</p>';
 }

 c.innerHTML=h;
 if(cur==='book'&&window.GDiaryBook){GDiaryBook.render(c);window.scrollTo(0,0)}
 var ad=document.getElementById('ad');
 if(ad)ad.onclick=function(){
  var v=document.getElementById('tx').value.trim();if(!v)return;
  P.diary[cur].push({x:v,d:Date.now(),at:sessionStorage.getItem('alch_v5_gLastStep')||''});
  save();render();
 };
 c.querySelectorAll('.del').forEach(function(b){b.onclick=function(){P.diary[cur].splice(+b.dataset.d,1);save();render()}});
 document.querySelectorAll('#tb button').forEach(function(b){b.onclick=function(){cur=b.dataset.t;render()}});
}
render();
</script><div id="backup" style="max-width:560px;margin:0 auto;padding:0 16px 120px;display:flex;gap:8px"><button onclick="GPro.exportFile()" style="flex:1;min-height:44px;border-radius:10px;border:1px solid #9e783a;background:#20170e;color:#f4ecdf;font:700 17px Manrope">Сохранить копию</button><label style="flex:1;min-height:44px;border-radius:10px;border:1px solid #9e783a;background:#20170e;color:#f4ecdf;font:700 17px Manrope;display:flex;align-items:center;justify-content:center">Восстановить<input type="file" accept=".json" hidden onchange="var f=this.files[0];if(!f)return;if(!confirm('Импорт заменит текущий профиль. Перед восстановлением будет сохранена автоматическая резервная копия. Продолжить?')){this.value='';return}GPro.importFile(f,function(o){alert(o?'Прогресс восстановлен. Предыдущая версия сохранена в резервной копии.':'Файл не подошел или не удалось сохранить резервную копию. Текущий профиль не заменен.');if(o)location.reload()});this.value=''"></label></div><div style="max-width:560px;margin:10px auto 110px;padding:0 16px"><button onclick="if(confirm('Вернуть последнюю автоматическую копию профиля? Текущая версия также будет сохранена.'))GPro.restoreBackup(function(o){alert(o?'Предыдущая копия восстановлена.':'Резервная копия не найдена или повреждена.');if(o)location.reload()})" style="width:100%;min-height:44px;border-radius:10px;border:1px solid #9e783a;background:transparent;color:#20170e;font:700 15px Manrope">Вернуть последнюю автоматическую копию</button><p style="font:13px/1.45 Manrope;color:#74634d;margin:8px 0">Перед каждым импортом сохраняется текущий профиль. В этом браузере хранятся до трех последних резервных копий.</p></div></body></html>
